<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 848 580" width="848" height="580" role="img" aria-label="Travelling through a no-network stretch"><rect width="848" height="580" fill="#FFFFFF"/><defs><marker id="s35_n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6A7B88"/></marker><marker id="s35_acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0B7A68"/></marker><marker id="s35_alert" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C2410C"/></marker><marker id="s35_info" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2F5DA8"/></marker><marker id="s35_data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B4FB3"/></marker><marker id="s35_warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A8690F"/></marker></defs><text x="24" y="38" font-size="15" font-weight="700" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#14202A">Travelling through a no-network stretch</text><line x1="124.0" x2="124.0" y1="98" y2="568" stroke="#C3CFD7" stroke-dasharray="4 4"/><rect x="34.0" y="58" width="180" height="40" rx="8" fill="#14202A" stroke="#14202A" stroke-width="1.4"/><text x="124.0" y="82" text-anchor="middle" font-size="12.5" font-weight="600" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#FFFFFF">Customer / driver app</text><line x1="324.0" x2="324.0" y1="98" y2="568" stroke="#C3CFD7" stroke-dasharray="4 4"/><rect x="234.0" y="58" width="180" height="40" rx="8" fill="#FBF0D9" stroke="#A8690F" stroke-width="1.4"/><text x="324.0" y="82" text-anchor="middle" font-size="12.5" font-weight="600" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#5C3A07">Coverage API</text><line x1="524.0" x2="524.0" y1="98" y2="568" stroke="#C3CFD7" stroke-dasharray="4 4"/><rect x="434.0" y="58" width="180" height="40" rx="8" fill="#FCE8DD" stroke="#C2410C" stroke-width="1.4"/><text x="524.0" y="82" text-anchor="middle" font-size="12.5" font-weight="600" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#6E250A">Safety service</text><line x1="724.0" x2="724.0" y1="98" y2="568" stroke="#C3CFD7" stroke-dasharray="4 4"/><rect x="634.0" y="58" width="180" height="40" rx="8" fill="#14202A" stroke="#14202A" stroke-width="1.4"/><text x="724.0" y="75" text-anchor="middle" font-size="12.5" font-weight="600" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#FFFFFF">Emergency</text><text x="724.0" y="89" text-anchor="middle" font-size="12.5" font-weight="600" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#FFFFFF">contacts</text><line x1="24" x2="824" y1="126" y2="126" stroke="#A8690F" stroke-dasharray="4 4"/><rect x="24" y="116" width="108.4" height="20" rx="4" fill="#FBF0D9" stroke="#A8690F"/><text x="32" y="130" font-size="11" font-weight="700" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#5C3A07">Before the trip</text><line x1="124.0" y1="154" x2="318.0" y2="154" stroke="#6A7B88" stroke-width="1.5" marker-end="url(#s35_n)"/><text x="224.0" y="148" text-anchor="middle" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#14202A">1. check route polyline</text><line x1="324.0" y1="188" x2="130.0" y2="188" stroke="#8A99A6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#s35_n)"/><text x="224.0" y="182" text-anchor="middle" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#566878">30 km dead zone, 11:10–11:55</text><path d="M124.0 222 H158.0 V240 H126.0" fill="none" stroke="#6A7B88" stroke-width="1.5" marker-end="url(#s35_n)"/><text x="164.0" y="235" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#14202A">2. download offline pack, choose backup plan</text><line x1="124.0" y1="260" x2="518.0" y2="260" stroke="#6A7B88" stroke-width="1.5" marker-end="url(#s35_n)"/><text x="324.0" y="254" text-anchor="middle" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#14202A">3. check-in window: back online by 11:55 + 20 min</text><line x1="24" x2="824" y1="300" y2="300" stroke="#A8690F" stroke-dasharray="4 4"/><rect x="24" y="290" width="114.56" height="20" rx="4" fill="#FBF0D9" stroke="#A8690F"/><text x="32" y="304" font-size="11" font-weight="700" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#5C3A07">In the dead zone</text><path d="M124.0 328 H158.0 V346 H126.0" fill="none" stroke="#6A7B88" stroke-width="1.5" marker-end="url(#s35_n)"/><text x="164.0" y="341" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#14202A">4. offline: GPS, map, tickets, queue events</text><path d="M124.0 366 H158.0 V384 H126.0" fill="none" stroke="#6A7B88" stroke-width="1.5" marker-end="url(#s35_n)"/><text x="164.0" y="379" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#14202A">5. SOS pressed → queued, sent by SMS at first signal</text><line x1="24" x2="824" y1="410" y2="410" stroke="#A8690F" stroke-dasharray="4 4"/><rect x="24" y="400" width="89.92" height="20" rx="4" fill="#FBF0D9" stroke="#A8690F"/><text x="32" y="414" font-size="11" font-weight="700" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#5C3A07">Two outcomes</text><line x1="124.0" y1="438" x2="518.0" y2="438" stroke="#6A7B88" stroke-width="1.5" marker-end="url(#s35_n)"/><text x="324.0" y="432" text-anchor="middle" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#14202A">6. back online 11:52 → sync, close window</text><rect x="40.0" y="460" width="768.0" height="40" rx="6" fill="#FCE8DD" stroke="#C2410C"/><text x="424.0" y="475" text-anchor="middle" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#6E250A">If not back by 12:15: safety team alerted with last known position; contacts notified.</text><text x="424.0" y="490" text-anchor="middle" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#6E250A">Team calls, checks bus/driver, and escalates if needed.</text><line x1="524.0" y1="526" x2="718.0" y2="526" stroke="#6B4FB3" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#s35_data)"/><text x="624.0" y="520" text-anchor="middle" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#14202A">7. alert with last position (only if overdue)</text></svg>