<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 888 455" width="888" height="455" role="img" aria-label="Why the Redis lock matters"><rect width="888" height="455" fill="#FFFFFF"/><defs><marker id="s7_n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6A7B88"/></marker><marker id="s7_acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0B7A68"/></marker><marker id="s7_alert" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C2410C"/></marker><marker id="s7_info" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2F5DA8"/></marker><marker id="s7_data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B4FB3"/></marker><marker id="s7_warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A8690F"/></marker></defs><text x="24" y="38" font-size="15" font-weight="700" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#14202A">Why the Redis lock matters</text><line x1="129.0" x2="129.0" y1="98" y2="443" stroke="#C3CFD7" stroke-dasharray="4 4"/><rect x="34.0" y="58" width="190" height="40" rx="8" fill="#DCF1EB" stroke="#0B7A68" stroke-width="1.4"/><text x="129.0" y="82" text-anchor="middle" font-size="12.5" font-weight="600" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#0A3F36">Dispatch A</text><line x1="339.0" x2="339.0" y1="98" y2="443" stroke="#C3CFD7" stroke-dasharray="4 4"/><rect x="244.0" y="58" width="190" height="40" rx="8" fill="#DCF1EB" stroke="#0B7A68" stroke-width="1.4"/><text x="339.0" y="82" text-anchor="middle" font-size="12.5" font-weight="600" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#0A3F36">Dispatch B</text><line x1="549.0" x2="549.0" y1="98" y2="443" stroke="#C3CFD7" stroke-dasharray="4 4"/><rect x="454.0" y="58" width="190" height="40" rx="8" fill="#EEE8FA" stroke="#6B4FB3" stroke-width="1.4"/><text x="549.0" y="82" text-anchor="middle" font-size="12.5" font-weight="600" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#3A2A66">Redis</text><line x1="759.0" x2="759.0" y1="98" y2="443" stroke="#C3CFD7" stroke-dasharray="4 4"/><rect x="664.0" y="58" width="190" height="40" rx="8" fill="#14202A" stroke="#14202A" stroke-width="1.4"/><text x="759.0" y="82" text-anchor="middle" font-size="12.5" font-weight="600" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#FFFFFF">Driver 42</text><rect x="40.8" y="108" width="386.4" height="25" rx="6" fill="#FBF0D9" stroke="#A8690F"/><text x="234.0" y="123" text-anchor="middle" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#5C3A07">Two rides want the same nearby driver at the same moment</text><line x1="129.0" y1="159" x2="543.0" y2="159" stroke="#6A7B88" stroke-width="1.5" marker-end="url(#s7_n)"/><text x="339.0" y="153" text-anchor="middle" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#14202A">1. SET lock:driver:42 ride_881 NX EX 20</text><line x1="549.0" y1="193" x2="135.0" y2="193" stroke="#8A99A6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#s7_n)"/><text x="339.0" y="187" text-anchor="middle" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#566878">OK</text><line x1="339.0" y1="227" x2="543.0" y2="227" stroke="#6A7B88" stroke-width="1.5" marker-end="url(#s7_n)"/><text x="444.0" y="221" text-anchor="middle" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#14202A">2. SET lock:driver:42 ride_882 NX EX 20</text><line x1="549.0" y1="261" x2="345.0" y2="261" stroke="#8A99A6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#s7_n)"/><text x="444.0" y="255" text-anchor="middle" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#566878">nil (already locked)</text><path d="M339.0 295 H373.0 V313 H341.0" fill="none" stroke="#6A7B88" stroke-width="1.5" marker-end="url(#s7_n)"/><text x="379.0" y="308" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#14202A">3. skip, try next candidate</text><line x1="129.0" y1="333" x2="753.0" y2="333" stroke="#6B4FB3" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#s7_data)"/><text x="444.0" y="327" text-anchor="middle" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#14202A">4. offer ride_881</text><line x1="759.0" y1="367" x2="135.0" y2="367" stroke="#6A7B88" stroke-width="1.5" marker-end="url(#s7_n)"/><text x="444.0" y="361" text-anchor="middle" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#14202A">5. accept</text><line x1="129.0" y1="401" x2="543.0" y2="401" stroke="#6A7B88" stroke-width="1.5" marker-end="url(#s7_n)"/><text x="339.0" y="395" text-anchor="middle" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#14202A">6. DEL lock, SET driver:42:busy</text></svg>