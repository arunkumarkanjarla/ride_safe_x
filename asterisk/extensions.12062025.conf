[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
TRUNK=SIP/airtelsip
[default]
exten => _9X.,1,Set(CALLERID(num)=+914049583230)
 same => n,Dial(SIP/${EXTEN}@airtelsip,60)
 same => n,Hangup()

[trunkinbound]

; Allow 9XXXXXXXXX style (10-digit numbers prefixed with 9)
exten => _9[6-9]XXXXXXXXX,1,NoOp(Manual outbound via Airtel to ${EXTEN})
 same => n,Set(CALLERID(num)=+914049583230)
 same => n,Dial(${TRUNK}/${EXTEN:1},60)
 same => n,Hangup()

; Allow 91XXXXXXXXXX format (i.e. 918688089287)
exten => _91[6-9]XXXXXXXXX,1,NoOp(Manual outbound via Airtel to ${EXTEN})
 same => n,Set(CALLERID(num)=+914049583230)
 same => n,Dial(${TRUNK}/${EXTEN},60)
 same => n,Hangup()
;[trunkinbound]
; === Incoming call routing from Airtel SIP trunk ===

; Specific DID match
;exten => 8688089287,1,NoOp(Incoming call for 8688089287)
 ;same => n,Dial(SIP/5001,30)
 ;same => n,Hangup()
[from-internal]
exten => _XX.,1,NoOp(${EXTEN})
 same => n,Dial(SIP/${EXTEN}@airtelsip,60,G(conf-answer,on-answer,1))
 same => n,Hangup()
[conf-answer]
exten => on-answer,1,NoOp(Call ended, entering MeetMe)
 same => n,ConfBridge(1234)                     ; MeetMe room 1234, with dynamic and music-on-hold
 same => n,Hangup()


; Fallback for unmatched DIDs
exten => s,1,NoOp(Fallback inbound - no specific DID matched)
 same => n,Dial(SIP/5001,30)
 same => n,Hangup()
