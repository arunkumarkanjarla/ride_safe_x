# AST-01 - coturn primary node
# Replace the example realm/public/private addresses before deployment.
listening-port=3478
# TLS listener required by AST-01
listening-ip=PRIMARY_PRIVATE_IP
relay-ip=PRIMARY_PRIVATE_IP
external-ip=PRIMARY_PUBLIC_IP/PRIMARY_PRIVATE_IP

# TURN over TLS
listening-port=3478
tls-listening-port=5349

fingerprint
use-auth-secret
static-auth-secret=REPLACE_WITH_LONG_RANDOM_TURN_SECRET
realm=turn.japit.example
server-name=turn-primary.japit.example

# Production safety
no-cli
no-multicast-peers
no-loopback-peers
stale-nonce=600

# Relay range should be opened on the firewall as well.
min-port=49152
max-port=65535

# Logging
simple-log
log-file=/var/log/turnserver/turnserver-primary.log
