; Japit provisioning templates.
; AST-01: ICE enabled for Japit WebRTC endpoints.
; TURN credentials are issued by the application API; do not store short-lived
; TURN usernames/passwords in Asterisk config.
; Dynamic endpoint/auth/aor objects are loaded from japit_call_center via ODBC realtime.
; AST-02: Live WebRTC realtime rows ({ext}ws) are synced with allow=opus,ulaw.
; Deskphone/X-Lite and Mediant trunks remain G.711 (ulaw/alaw) only.

[japit-endpoint-template](!)
type=endpoint
transport=transport-ws
context=japit-internal
disallow=all
; Template baseline for WebRTC-style endpoints. Realtime sync is source of truth.
allow=opus,ulaw
direct_media=yes
rewrite_contact=yes
force_rport=yes
rtp_symmetric=yes
ice_support=yes
trust_id_inbound=yes
send_pai=yes
send_rpid=yes
timers=yes
allow_subscribe=yes
device_state_busy_at=1
; WebRTC endpoints must retain ICE support for remote NAT traversal. Realtime
; endpoint rows should set ice_support=yes and keep media encryption / DTLS
; options compatible with browser WebRTC. TURN credentials are browser-only;
; do not place the coturn shared REST secret in this file.
; AST-21: WebRTC legs MUST use media_encryption=dtls (DTLS-SRTP).
; Do not set media_encryption=no on WebRTC endpoints. Silent RTP downgrade is rejected
; by python-service media encryption policy (telephony_sync._endpoint_profile).
ice_support=yes

[japit-aor-template](!)
type=aor
max_contacts=5
remove_existing=yes
support_path=yes

[japit-auth-template](!)
type=auth
auth_type=userpass
