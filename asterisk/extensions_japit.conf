[japit-join-conf]
; Dial U(japit-join-conf^${JAPIT_AGENT_EXT}) → Gosub(japit-join-conf,s,1(ARG1=agent ext)).
; AST-22: AMD runs here after PSTN answer (far-end audio exists). Gated by JAPIT_AMD_ENABLED.
; UserEvent then Return — keep Dial simple_bridge for WebRTC↔Mediant audio.
; AST-06 trunk failover and AST-15 toll-fraud already ran in japit-pstn-dial.
exten => s,1,NoOp(Japit outbound PSTN answered — agent ${ARG1})
same => n,GotoIf($["${JAPIT_AMD_ENABLED}"!="1"]?amd-skip)
same => n,NoOp(Japit AMD profile=${JAPIT_AMD_PROFILE} source=${JAPIT_AMD_SOURCE})
same => n,Set(JAPIT_AMD_T0=${EPOCH})
same => n,AMD(${JAPIT_AMD_INITIAL_SILENCE},${JAPIT_AMD_GREETING},${JAPIT_AMD_AFTER_GREETING_SILENCE},${JAPIT_AMD_TOTAL_ANALYSIS_TIME},${JAPIT_AMD_MIN_WORD_LENGTH},${JAPIT_AMD_BETWEEN_WORDS_SILENCE},${JAPIT_AMD_MAXIMUM_NUMBER_OF_WORDS},${JAPIT_AMD_SILENCE_THRESHOLD},${JAPIT_AMD_MAXIMUM_WORD_LENGTH})
same => n,Set(JAPIT_AMD_RESULT=${AMDSTATUS})
same => n,Set(JAPIT_AMD_CAUSE=${AMDCAUSE})
same => n,Set(JAPIT_AMD_DURATION_MS=$[$[${EPOCH}-${JAPIT_AMD_T0}]*1000])
same => n,CELGenUserEvent(JAPIT_AMD_RESULT,Extra:session=${JAPIT_CALL_SESSION_ID}\;logical=${JAPIT_LOGICAL_CALL_ID}\;result=${AMDSTATUS}\;cause=${AMDCAUSE}\;profile=${JAPIT_AMD_PROFILE}\;source=${JAPIT_AMD_SOURCE})
same => n,UserEvent(JapitAmdResult,CallSessionId:${JAPIT_CALL_SESSION_ID},LogicalCallId:${JAPIT_LOGICAL_CALL_ID},CampaignId:${JAPIT_CAMPAIGN_ID},LeadId:${JAPIT_LEAD_ID},CallbackId:${JAPIT_CALLBACK_ID},Result:${AMDSTATUS},Cause:${AMDCAUSE},Profile:${JAPIT_AMD_PROFILE},Source:${JAPIT_AMD_SOURCE},DurationMs:${JAPIT_AMD_DURATION_MS},LinkedId:${CHANNEL(linkedid)},Node:${JAPIT_ASTERISK_NODE_ID})
same => n,GotoIf($["${AMDSTATUS}"="MACHINE" & "${JAPIT_AMD_ACTION}"="hangup"]?amd-hangup)
same => n,GotoIf($["${AMDSTATUS}"="NOTSURE" & "${JAPIT_AMD_UNKNOWN_ACTION}"="hangup"]?amd-hangup)
same => n,GotoIf($["${AMDSTATUS}"="HANGUP" & "${JAPIT_AMD_UNKNOWN_ACTION}"="hangup"]?amd-hangup)
same => n(amd-skip),UserEvent(JapitOriginationAnswered,AgentExt:${ARG1},CustomerNo:${JAPIT_CUSTOMER_NO},CustomerChannel:${CHANNEL(name)},Did:${JAPIT_DID},Queue:${JAPIT_QUEUE_NAME},Campaign:${JAPIT_CAMPAIGN_NAMESPACE},LinkedId:${CHANNEL(linkedid)})
same => n,Return()
same => n(amd-hangup),NoOp(Japit AMD hangup result=${AMDSTATUS} action=${JAPIT_AMD_ACTION})
same => n,Hangup()

