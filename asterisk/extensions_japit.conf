same => n,UserEvent(JapitRtpQos,Uniqueid:${CHANNEL(uniqueid)},LinkedId:${CHANNEL(linkedid)},Channel:${CHANNEL},Direction:${IF($["${JAPIT_DIRECTION}"=""]?unknown:${JAPIT_DIRECTION})},TxJitter:${CHANNEL(rtpqos,audio,txjitter)},RxJitter:${CHANNEL(rtpqos,audio,rxjitter)},TxPLoss:${CHANNEL(rtpqos,audio,txploss)},RxPLoss:${CHANNEL(rtpqos,audio,rxploss)},TxCount:${CHANNEL(rtpqos,audio,txcount)},RxCount:${CHANNEL(rtpqos,audio,rxcount)},RTT:${CHANNEL(rtpqos,audio,rtt)},Session:${JAPIT_CALL_SESSION_ID},Logical:${JAPIT_LOGICAL_CALL_ID},Node:${IF($["${JAPIT_ASTERISK_NODE_ID}"=""]?${JAPIT_NODE_ID}:${JAPIT_ASTERISK_NODE_ID})},Source:rtpqos)
same => n,Return()

