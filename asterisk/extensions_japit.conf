; Japit-only dialplan wrapper and fallthrough routing.
; This file never replaces the legacy arun_asterisk contexts.
;
; Create [globals] BEFORE includes. Live extensions.conf has no [globals], so
; [globals](+) in this file / extensions_japit_emergency.conf would fail and
; drop japit-internal from the running dialplan (AMI: Extension does not exist).

[globals]
; AST-19 / AST-12 node identity — override per node overlay (pbx-1 / pbx-2).
JAPIT_NODE_ID=pbx-1

#include extensions_japit_emergency.conf
#include extensions_japit_tollfraud.conf

[japit-direct-inbound]
exten => _+X.,1,NoOp(Japit pre-router inbound DID with plus ${EXTEN})
same => n,Set(JAPIT_DID=${EXTEN:1})
same => n,Goto(japit-pre-router,${JAPIT_DID},1)

exten => _X.,1,NoOp(Japit pre-router inbound DID ${EXTEN})
same => n,Set(JAPIT_DID=${EXTEN})
same => n,Goto(japit-pre-router,${JAPIT_DID},1)

[japit-pre-router]
exten => _X.,1,NoOp(Japit route discovery for ${EXTEN})
same => n,Set(JAPIT_ROUTE_TYPE=${ODBC_GET_JAPIT_DID_ROUTE_TYPE(${EXTEN})})
same => n,GotoIf($["${JAPIT_ROUTE_TYPE}"=""]?legacy)
same => n,Goto(japit-inbound,${EXTEN},1)
same => n(legacy),NoOp(Legacy fallback for helpdesk DID ${EXTEN})
same => n,Goto(inbound,${EXTEN},1)

[japit-internal]
; Local echo for WebRTC / softphone audio validation (must be before _X. outbound).
exten => 999,1,NoOp(Japit WebRTC echo test)
same => n,Answer()
same => n,Echo()
same => n,Hangup()

exten => _XXXX,1,NoOp(Japit internal extension ${EXTEN})
same => n,GotoIf($["${GLOBAL(JAPIT_BRIDGE_RING)}"="${EXTEN}"]?bridge-wait)
same => n,GotoIf($["${JAPIT_BRIDGE_CONNECT}"="1"]?bridge-wait)
same => n,GotoIf($["${CALLERID(num)}"="${EXTEN}"]?bridge-wait)
same => n,Set(JAPIT_TARGET_EXTENSION=${EXTEN})
same => n,Goto(japit-extension-route,s,1)
exten => _XXXX,n(bridge-wait),NoOp(Japit deskphone bridge leg ${EXTEN} - do not re-dial)
same => n,Wait(120)
same => n,Hangup()

exten => _X.,1,NoOp(Japit outbound from ${CHANNEL(endpoint)})
same => n,Set(JAPIT_AGENT_RAW=${IF($[${LEN(${JAPIT_AGENT_EXT})}>0]?${JAPIT_AGENT_EXT}:${CHANNEL(endpoint)})})
same => n,ExecIf($["${JAPIT_AGENT_RAW:-2}"="ws"]?Set(JAPIT_AGENT_EXT=${JAPIT_AGENT_RAW:0:$[${LEN(${JAPIT_AGENT_RAW})}-2]}):Set(JAPIT_AGENT_EXT=${JAPIT_AGENT_RAW}))
; AST-14: emergency numbers take a dedicated route before normal outbound policy.
same => n,Gosub(japit-emergency-detect,s,1(${EXTEN}))
same => n,GotoIf($["${JAPIT_IS_EMERGENCY}"="1"]?japit-emergency,${EXTEN},1)
same => n,Goto(japit-app-outbound,${EXTEN},1)

exten => *910,1,Goto(japit-heartbeat,s,1)

[japit-inbound]
exten => _X.,1,NoOp(Japit inbound route for DID ${EXTEN})
same => n,Set(__JAPIT_DID=${EXTEN})
same => n,Set(__JAPIT_CUSTOMER_NO=${CALLERID(num)})
same => n,Set(__JAPIT_CAMPAIGN_NAMESPACE=${ODBC_GET_JAPIT_DID_CAMPAIGN_NAMESPACE(${EXTEN})})
same => n,ExecIf($["${JAPIT_CAMPAIGN_NAMESPACE}"=""]?Set(__JAPIT_CAMPAIGN_NAMESPACE=default))
same => n,Set(__JAPIT_DIRECTION=inbound)
same => n,Set(CHANNEL(hangup_handler_push)=japit-recording-hangup,s,1)
same => n,Set(CHANNEL(hangup_handler_push)=japit-rtp-qos-hangup,s,1)
; Phase 4 engine: mode from SQL (kill-switch aware). Default legacy keeps existing ODBC path.
same => n,Set(JAPIT_ENGINE_MODE=${ODBC_GET_JAPIT_ROUTING_ENGINE_MODE(${EXTEN})})
same => n,ExecIf($["${JAPIT_ENGINE_MODE}"=""]?Set(JAPIT_ENGINE_MODE=legacy))
same => n,GotoIf($["${JAPIT_ENGINE_MODE}"="live"]?engine-live)
same => n,GotoIf($["${JAPIT_ENGINE_MODE}"="shadow"]?engine-shadow:legacy-odbc)
same => n(engine-shadow),NoOp(Phase4 shadow: legacy ODBC applies; async engine compare)
same => n,Set(JAPIT_ENGINE_URL=${ODBC_GET_JAPIT_ROUTING_ENGINE_BASE_URL()})
; Fire-and-forget shadow decide (1s max). Never blocks call path on failure.
same => n,TrySystem(curl -s -m 1 "${JAPIT_ENGINE_URL}/api/v1/telephony/routing/shadow?did=${EXTEN}&linkedid=${CHANNEL(linkedid)}" >/dev/null 2>&1 &)
same => n,Goto(legacy-odbc)
same => n(engine-live),NoOp(Phase4 live: CURL decide with hard timeout; fail → legacy ODBC)
same => n,Set(JAPIT_ENGINE_URL=${ODBC_GET_JAPIT_ROUTING_ENGINE_BASE_URL()})
same => n,Set(CURLOPT(httptimeout)=1)
same => n,Set(JAPIT_ENGINE_RAW=${CURL(${JAPIT_ENGINE_URL}/api/v1/telephony/routing/decide-simple?did=${EXTEN}&linkedid=${CHANNEL(linkedid)})})
same => n,NoOp(Phase4 engine raw=${JAPIT_ENGINE_RAW})
same => n,GotoIf($["${JAPIT_ENGINE_RAW}"=""]?legacy-odbc)
same => n,Set(JAPIT_ENGINE_STATUS=${CUT(JAPIT_ENGINE_RAW,|,1)})
same => n,GotoIf($["${JAPIT_ENGINE_STATUS}"!="ok"]?legacy-odbc)
same => n,Set(JAPIT_ROUTE_TYPE=${CUT(JAPIT_ENGINE_RAW,|,2)})
same => n,Set(JAPIT_ROUTE_TARGET=${CUT(JAPIT_ENGINE_RAW,|,3)})
same => n,Set(JAPIT_ROUTE_STATE=${CUT(JAPIT_ENGINE_RAW,|,4)})
same => n,Set(__JAPIT_ENGINE_TRACE=${CUT(JAPIT_ENGINE_RAW,|,5)})
same => n,GotoIf($["${JAPIT_ROUTE_TYPE}"=""]?legacy-odbc)
same => n,Goto(route-dispatch)
same => n(legacy-odbc),NoOp(Phase4 legacy ODBC resolve_did_route)
same => n,Set(JAPIT_ROUTE_TYPE=${ODBC_GET_JAPIT_DID_ROUTE_TYPE(${EXTEN})})
same => n,Set(JAPIT_ROUTE_TARGET=${ODBC_GET_JAPIT_DID_ROUTE_TARGET(${EXTEN})})
same => n,Set(JAPIT_ROUTE_STATE=${ODBC_GET_JAPIT_DID_ROUTE_STATE(${EXTEN})})
same => n(route-dispatch),GotoIf($["${JAPIT_ROUTE_TYPE}"=""]?legacy-fallback)
same => n,GotoIf($["${JAPIT_ROUTE_TYPE}"="ivr"]?ivr)
same => n,GotoIf($["${JAPIT_ROUTE_TYPE}"="queue"]?queue)
same => n,GotoIf($["${JAPIT_ROUTE_TYPE}"="extension"]?extension)
same => n,GotoIf($["${JAPIT_ROUTE_TYPE}"="voicemail"]?voicemail)
same => n,GotoIf($["${JAPIT_ROUTE_TYPE}"="stasis"]?stasis)
same => n,GotoIf($["${JAPIT_ROUTE_TYPE}"="callback"]?callback)
same => n,GotoIf($["${JAPIT_ROUTE_TYPE}"="hangup"]?hangup)
same => n,Goto(legacy-fallback)
same => n(ivr),Set(JAPIT_IVR_CODE=${JAPIT_ROUTE_TARGET})
same => n,Goto(japit-ivr,s,1)
same => n(queue),Set(JAPIT_QUEUE_NAME=${JAPIT_ROUTE_TARGET})
same => n,Goto(japit-queue,s,1)
same => n(extension),Set(JAPIT_TARGET_EXTENSION=${JAPIT_ROUTE_TARGET})
same => n,Goto(japit-extension-route,s,1)
same => n(voicemail),Set(JAPIT_MAILBOX=${JAPIT_ROUTE_TARGET})
same => n,Set(JAPIT_VOICEMAIL_SOURCE=direct_route)
same => n,Goto(japit-voicemail,s,1)
; AST-23: japit-ari worker consumes Stasis app japit_call_control (does not replace AMI).
same => n(stasis),Stasis(japit_call_control,${EXTEN},${JAPIT_ROUTE_TYPE},${JAPIT_ROUTE_TARGET})
same => n,Hangup()
same => n(callback),Set(JAPIT_CALLBACK_QUEUE=${JAPIT_ROUTE_TARGET})
same => n,Goto(japit-callback,s,1)
same => n(hangup),Hangup()
same => n(legacy-fallback),NoOp(No Japit route found, using legacy inbound context)
same => n,Goto(inbound,${EXTEN},1)

[japit-ivr]
exten => s,1,NoOp(Japit IVR ${JAPIT_IVR_CODE})
same => n,ExecIf($["${CHANNEL(state)}"!="Up"]?Answer())
same => n,Wait(1)
same => n,Set(JAPIT_IVR_WELCOME=${ODBC_GET_JAPIT_IVR_WELCOME(${JAPIT_IVR_CODE})})
same => n,Set(JAPIT_IVR_INVALID=${ODBC_GET_JAPIT_IVR_INVALID(${JAPIT_IVR_CODE})})
same => n,Set(JAPIT_IVR_TIMEOUT=${ODBC_GET_JAPIT_IVR_TIMEOUT(${JAPIT_IVR_CODE})})
same => n,Set(JAPIT_IVR_TIMEOUT=${IF($[${LEN(${JAPIT_IVR_TIMEOUT})}=0]?5:${JAPIT_IVR_TIMEOUT})})
same => n,Set(JAPIT_IVR_DEFAULT_TYPE=${ODBC_GET_JAPIT_IVR_DEFAULT_TYPE(${JAPIT_IVR_CODE})})
same => n,Set(JAPIT_IVR_DEFAULT_TARGET=${ODBC_GET_JAPIT_IVR_DEFAULT_TARGET(${JAPIT_IVR_CODE})})
same => n,GotoIf($["${JAPIT_IVR_WELCOME}"=""]?menu)
; Background (not Playback) so DTMF digits interrupt the prompt immediately.
same => n,Background(${JAPIT_IVR_WELCOME})
same => n(menu),WaitExten(${JAPIT_IVR_TIMEOUT})

exten => i,1,NoOp(Japit IVR invalid input for ${JAPIT_IVR_CODE})
same => n,GotoIf($["${JAPIT_IVR_INVALID}"=""]?default,1)
same => n,Background(${JAPIT_IVR_INVALID})
same => n,Goto(s,menu)

exten => t,1,NoOp(Japit IVR timeout for ${JAPIT_IVR_CODE})
same => n,Goto(japit-ivr-default,s,1)

exten => _X,1,NoOp(Japit IVR digit ${EXTEN} for ${JAPIT_IVR_CODE})
same => n,Set(JAPIT_IVR_DIGIT=${EXTEN})
same => n,Set(JAPIT_ACTION_TYPE=${ODBC_GET_JAPIT_IVR_ACTION_TYPE(${JAPIT_IVR_CODE},${EXTEN})})
same => n,Set(JAPIT_ACTION_TARGET=${ODBC_GET_JAPIT_IVR_ACTION_TARGET(${JAPIT_IVR_CODE},${EXTEN})})
same => n,Goto(japit-ivr-dispatch,s,1)

[japit-ivr-default]
exten => s,1,NoOp(Japit IVR default route ${JAPIT_IVR_DEFAULT_TYPE} => ${JAPIT_IVR_DEFAULT_TARGET})
same => n,Set(JAPIT_ACTION_TYPE=${JAPIT_IVR_DEFAULT_TYPE})
same => n,Set(JAPIT_ACTION_TARGET=${JAPIT_IVR_DEFAULT_TARGET})
same => n,Goto(japit-ivr-dispatch,s,1)

[japit-ivr-dispatch]
exten => s,1,NoOp(Japit IVR dispatch ${JAPIT_ACTION_TYPE} => ${JAPIT_ACTION_TARGET})
same => n,GotoIf($["${JAPIT_ACTION_TYPE}"="queue"]?queue)
same => n,GotoIf($["${JAPIT_ACTION_TYPE}"="extension"]?extension)
same => n,GotoIf($["${JAPIT_ACTION_TYPE}"="voicemail"]?voicemail)
same => n,GotoIf($["${JAPIT_ACTION_TYPE}"="callback"]?callback)
 ; Admin portal stores nested IVR as action_type=ivr; legacy used nested_ivr.
same => n,GotoIf($["${JAPIT_ACTION_TYPE}"="ivr"]?nested)
same => n,GotoIf($["${JAPIT_ACTION_TYPE}"="nested_ivr"]?nested)
same => n,GotoIf($["${JAPIT_ACTION_TYPE}"="playback"]?playback)
same => n,GotoIf($["${JAPIT_ACTION_TYPE}"="stasis"]?stasis)
same => n,GotoIf($["${JAPIT_ACTION_TYPE}"="hangup"]?hangup)
same => n,Goto(hangup)
same => n(queue),Set(JAPIT_QUEUE_NAME=${JAPIT_ACTION_TARGET})
same => n,Goto(japit-queue,s,1)
same => n(extension),Set(JAPIT_TARGET_EXTENSION=${JAPIT_ACTION_TARGET})
same => n,Goto(japit-extension-route,s,1)
same => n(voicemail),Set(JAPIT_MAILBOX=${JAPIT_ACTION_TARGET})
same => n,Set(JAPIT_VOICEMAIL_SOURCE=ivr)
same => n,Goto(japit-voicemail,s,1)
same => n(callback),Set(JAPIT_CALLBACK_QUEUE=${JAPIT_ACTION_TARGET})
; IVR builders often set action_target=callback; bind to the active queue instead.
same => n,ExecIf($["${JAPIT_CALLBACK_QUEUE}"=""]?Set(JAPIT_CALLBACK_QUEUE=${JAPIT_QUEUE_NAME}))
same => n,ExecIf($["${JAPIT_CALLBACK_QUEUE}"="callback"]?Set(JAPIT_CALLBACK_QUEUE=${JAPIT_QUEUE_NAME}))
same => n,ExecIf($["${JAPIT_CALLBACK_QUEUE}"="callbacks"]?Set(JAPIT_CALLBACK_QUEUE=${JAPIT_QUEUE_NAME}))
; No-agent / queue busy path: never steal the caller's queue onto a hardcoded target (e.g. japit).
same => n,ExecIf($[${LEN(${JAPIT_QUEUE_NAME})}>0]?Set(JAPIT_CALLBACK_QUEUE=${JAPIT_QUEUE_NAME}))
same => n,Goto(japit-callback,s,1)
same => n(nested),NoOp(Japit nested IVR ${JAPIT_ACTION_TARGET})
same => n,GotoIf($[${LEN(${JAPIT_ACTION_TARGET})}=0]?hangup)
same => n,Set(JAPIT_IVR_CODE=${JAPIT_ACTION_TARGET})
same => n,Goto(japit-ivr,s,1)
same => n(playback),NoOp(Japit IVR playback ${JAPIT_ACTION_TARGET})
same => n,ExecIf($[${LEN(${JAPIT_ACTION_TARGET})}=0]?Hangup())
same => n,Playback(${JAPIT_ACTION_TARGET})
same => n,Goto(japit-ivr,s,1)
same => n(stasis),Stasis(japit_call_control,${JAPIT_DID},${JAPIT_ACTION_TYPE},${JAPIT_ACTION_TARGET})
same => n,Hangup()
same => n(hangup),Hangup()

[japit-queue]
exten => s,1,NoOp(Japit queue route ${JAPIT_QUEUE_NAME})
same => n,ExecIf($["${CHANNEL(state)}"!="Up"]?Answer())
same => n,Set(__JAPIT_QUEUE_NAME=${JAPIT_QUEUE_NAME})
; AST-15: stamp queue into reporting channel vars (CEL USER_DEFINED + AMI).
same => n,Gosub(japit-report-meta,s,1(${JAPIT_QUEUE_NAME},,,))
; Preserve the original entry time across a callback-create failure requeue.
same => n,ExecIf($[${LEN(${JAPIT_QUEUE_ENTER_EPOCH})}=0]?Set(__JAPIT_QUEUE_ENTER_EPOCH=${EPOCH}))
; Inherited across Queue() re-entry. A source queue is appended only after a move.
same => n,ExecIf($[${LEN(${JAPIT_OVERFLOW_HOP})}=0]?Set(__JAPIT_OVERFLOW_HOP=0))
same => n,ExecIf($[${LEN(${JAPIT_OVERFLOW_VISITED})}=0]?Set(__JAPIT_OVERFLOW_VISITED=))
same => n,ExecIf($[${LEN(${JAPIT_OVERFLOW_MAX_HOPS})}=0]?Set(__JAPIT_OVERFLOW_MAX_HOPS=3))
same => n,Set(JAPIT_QUEUE_WAIT_TIMEOUT=${ODBC_GET_JAPIT_QUEUE_WAIT_TIMEOUT(${JAPIT_QUEUE_NAME})})
same => n,Set(JAPIT_QUEUE_WAIT_TIMEOUT=${IF($[${LEN(${JAPIT_QUEUE_WAIT_TIMEOUT})}=0]?120:${JAPIT_QUEUE_WAIT_TIMEOUT})})
; If no ready agents (all busy / paused / unavailable), play busy IVR immediately —
; do not dial Local/@japit-agent-offer into an agent already on another call.
same => n,Set(JAPIT_Q_READY=${QUEUE_MEMBER(${JAPIT_QUEUE_NAME},ready)})
same => n,NoOp(Japit queue ${JAPIT_QUEUE_NAME} ready_members=${JAPIT_Q_READY})
same => n,GotoIf($[${JAPIT_Q_READY} < 1]?busy-now)
; Snapshot before Queue() so the caller hears their initial position and Phase 5 EWT.
same => n,Set(JAPIT_Q_WAITING=${QUEUE_MEMBER(${JAPIT_QUEUE_NAME},count)})
same => n,Set(JAPIT_Q_POSITION=$[${JAPIT_Q_WAITING} + 1])
same => n,Gosub(japit-queue-announce,s,1)
; Strategy-aware offering:
; - ringall: do not skill-gate with QUEUE_MAX_PENALTY=0 (ring every ready member).
; - leastrecent/rrmemory/etc: skill-first MAX=0, then expand on Decline via AMI/rules.
same => n,Set(JAPIT_QUEUE_STRATEGY=${ODBC_GET_JAPIT_QUEUE_STRATEGY(${JAPIT_QUEUE_NAME})})
same => n,GotoIf($["${JAPIT_QUEUE_STRATEGY}"="ringall"]?queue-ringall)
same => n,ExecIf($[${LEN(${QUEUE_MAX_PENALTY})}=0]?Set(__QUEUE_MAX_PENALTY=0))
same => n,Set(__JAPIT_SKILL_FIRST=1)
same => n,Goto(sticky-lookup)
same => n(queue-ringall),Set(__QUEUE_MAX_PENALTY=100)
same => n,Set(__JAPIT_SKILL_FIRST=0)
; Phase 29 AST-28 — optional last-agent preference. Fail open to Queue() on any miss.
same => n(sticky-lookup),Set(JAPIT_ENGINE_URL=${ODBC_GET_JAPIT_ROUTING_ENGINE_BASE_URL()})
same => n,GotoIf($["${JAPIT_ENGINE_URL}"=""]?queue-enter)
same => n,Set(CURLOPT(httptimeout)=1)
same => n,Set(JAPIT_STICKY_RAW=${CURL(${JAPIT_ENGINE_URL}/api/v1/telephony/queue/sticky/decide-simple?queue_name=${JAPIT_QUEUE_NAME}&ani=${IF($[${LEN(${JAPIT_CUSTOMER_NO})}>0]?${FILTER(0123456789,${JAPIT_CUSTOMER_NO})}:${FILTER(0123456789,${CALLERID(num)})})}&linkedid=${CHANNEL(linkedid)})})
same => n,Set(JAPIT_STICKY_STATUS=${CUT(JAPIT_STICKY_RAW,|,1)})
same => n,NoOp(Japit sticky status=${JAPIT_STICKY_STATUS})
same => n,GotoIf($["${JAPIT_STICKY_STATUS}"!="ok"]?queue-enter)
same => n,Set(__JAPIT_STICKY_EXTEN=${CUT(JAPIT_STICKY_RAW,|,2)})
same => n,GotoIf($[${LEN(${JAPIT_STICKY_EXTEN})}=0]?queue-enter)
same => n,Set(__JAPIT_STICKY_MODE=1)
same => n,Set(__QUEUE_MAX_PENALTY=100)
same => n(queue-enter),Queue(${JAPIT_QUEUE_NAME},tT,,,${JAPIT_QUEUE_WAIT_TIMEOUT})
same => n,NoOp(Japit queue ${JAPIT_QUEUE_NAME} strategy=${JAPIT_QUEUE_STRATEGY} returned ${QUEUESTATUS})
same => n,Set(JAPIT_OVERFLOW_STATUS=${QUEUESTATUS})
same => n,Goto(overflow-evaluate)
; Evaluator is attempted once for each Queue()/JOINEMPTY result. Any bad/empty
; response, loop guard, or backend outage continues to the legacy ODBC failover.
same => n(overflow-evaluate),Set(JAPIT_Q_READY=${QUEUE_MEMBER(${JAPIT_QUEUE_NAME},ready)})
same => n,Set(JAPIT_Q_WAITING=${QUEUE_MEMBER(${JAPIT_QUEUE_NAME},count)})
same => n,GotoIf($[${JAPIT_OVERFLOW_HOP} >= ${JAPIT_OVERFLOW_MAX_HOPS}]?overflow-legacy)
same => n,Set(JAPIT_ENGINE_URL=${ODBC_GET_JAPIT_ROUTING_ENGINE_BASE_URL()})
same => n,GotoIf($["${JAPIT_ENGINE_URL}"=""]?overflow-legacy)
same => n,Set(CURLOPT(httptimeout)=1)
same => n,Set(JAPIT_OVERFLOW_RAW=${CURL(${JAPIT_ENGINE_URL}/api/v1/telephony/queue/overflow/decide-simple?queue_name=${JAPIT_QUEUE_NAME}&queue_status=${JAPIT_OVERFLOW_STATUS}&ready_count=${JAPIT_Q_READY}&waiting_count=${JAPIT_Q_WAITING}&hop=${JAPIT_OVERFLOW_HOP}&visited=${JAPIT_OVERFLOW_VISITED}&linkedid=${CHANNEL(linkedid)})})
same => n,NoOp(Japit overflow raw=${JAPIT_OVERFLOW_RAW})
same => n,Set(JAPIT_OVERFLOW_STATUS_CODE=${CUT(JAPIT_OVERFLOW_RAW,|,1)})
same => n,GotoIf($["${JAPIT_OVERFLOW_STATUS_CODE}"!="ok"]?overflow-legacy)
same => n,Set(JAPIT_OVERFLOW_TARGET=${CUT(JAPIT_OVERFLOW_RAW,|,2)})
same => n,Set(JAPIT_OVERFLOW_REASON=${CUT(JAPIT_OVERFLOW_RAW,|,3)})
same => n,Set(JAPIT_OVERFLOW_NEXT_HOP=${CUT(JAPIT_OVERFLOW_RAW,|,4)})
same => n,Set(JAPIT_OVERFLOW_RULE_ID=${CUT(JAPIT_OVERFLOW_RAW,|,5)})
same => n,GotoIf($["${JAPIT_OVERFLOW_TARGET}"=""]?overflow-legacy)
same => n,GotoIf($["${JAPIT_OVERFLOW_TARGET}"="${JAPIT_QUEUE_NAME}"]?overflow-legacy)
same => n,GotoIf($[${JAPIT_OVERFLOW_NEXT_HOP} > ${JAPIT_OVERFLOW_MAX_HOPS}]?overflow-legacy)
same => n,Set(JAPIT_OVERFLOW_TARGET_VISITED=${REGEX("(^|,)${JAPIT_OVERFLOW_TARGET}(,|$)" ${JAPIT_OVERFLOW_VISITED})})
same => n,GotoIf($["${JAPIT_OVERFLOW_TARGET_VISITED}"="1"]?overflow-legacy)
same => n,Set(CDR(userfield)=overflow:${JAPIT_QUEUE_NAME}>${JAPIT_OVERFLOW_TARGET}:hop=${JAPIT_OVERFLOW_NEXT_HOP}:reason=${JAPIT_OVERFLOW_REASON})
same => n,Set(CDR(accountcode)=overflow)
same => n,CELGenUserEvent(JAPIT_OVERFLOW,Extra:src=${JAPIT_QUEUE_NAME}\;tgt=${JAPIT_OVERFLOW_TARGET}\;hop=${JAPIT_OVERFLOW_NEXT_HOP}\;reason=${JAPIT_OVERFLOW_REASON})
same => n,UserEvent(JapitQueueOverflow,SourceQueue:${JAPIT_QUEUE_NAME},TargetQueue:${JAPIT_OVERFLOW_TARGET},Hop:${JAPIT_OVERFLOW_NEXT_HOP},Reason:${JAPIT_OVERFLOW_REASON},RuleId:${JAPIT_OVERFLOW_RULE_ID},LinkedId:${CHANNEL(linkedid)},Timestamp:${STRFTIME(${EPOCH},,%Y-%m-%dT%H:%M:%SZ)})
same => n,Verbose(2,Japit queue overflow ${JAPIT_QUEUE_NAME} -> ${JAPIT_OVERFLOW_TARGET} hop ${JAPIT_OVERFLOW_NEXT_HOP} reason ${JAPIT_OVERFLOW_REASON})
same => n,Set(__JAPIT_OVERFLOW_HOP=${JAPIT_OVERFLOW_NEXT_HOP})
same => n,Set(__JAPIT_OVERFLOW_VISITED=${IF($["${JAPIT_OVERFLOW_VISITED}"=""]?${JAPIT_QUEUE_NAME}:${JAPIT_OVERFLOW_VISITED},${JAPIT_QUEUE_NAME})})
same => n,Set(__JAPIT_QUEUE_NAME=${JAPIT_OVERFLOW_TARGET})
same => n,Goto(japit-queue,s,1)
same => n(overflow-legacy),NoOp(Japit queue overflow unavailable/not matched; use legacy ODBC failover)
same => n,GotoIf($["${JAPIT_OVERFLOW_STATUS}"="JOINEMPTY"]?busy-failover)
same => n,Set(JAPIT_FAILOVER_TYPE=${ODBC_GET_JAPIT_QUEUE_FAILOVER_TYPE(${JAPIT_QUEUE_NAME},${QUEUESTATUS})})
same => n,Set(JAPIT_FAILOVER_TARGET=${ODBC_GET_JAPIT_QUEUE_FAILOVER_TARGET(${JAPIT_QUEUE_NAME},${QUEUESTATUS})})
same => n,ExecIf($["${JAPIT_FAILOVER_TYPE}"=""]?Set(JAPIT_FAILOVER_TYPE=${ODBC_GET_JAPIT_QUEUE_FAILOVER_TYPE(${JAPIT_QUEUE_NAME},default)}))
same => n,ExecIf($["${JAPIT_FAILOVER_TARGET}"=""]?Set(JAPIT_FAILOVER_TARGET=${ODBC_GET_JAPIT_QUEUE_FAILOVER_TARGET(${JAPIT_QUEUE_NAME},default)}))
same => n,ExecIf($["${JAPIT_FAILOVER_TYPE}"=""]?Set(JAPIT_FAILOVER_TYPE=ivr))
same => n,ExecIf($["${JAPIT_FAILOVER_TARGET}"=""]?Set(JAPIT_FAILOVER_TARGET=${ODBC_GET_JAPIT_QUEUE_BUSY_IVR(${JAPIT_QUEUE_NAME})}))
same => n,GotoIf($["${JAPIT_FAILOVER_TYPE}"="ivr"]?failover-ivr)
same => n,GotoIf($["${JAPIT_FAILOVER_TYPE}"="extension"]?failover-extension)
same => n,GotoIf($["${JAPIT_FAILOVER_TYPE}"="voicemail"]?failover-voicemail)
same => n,GotoIf($["${JAPIT_FAILOVER_TYPE}"="callback"]?failover-callback)
same => n,GotoIf($["${JAPIT_FAILOVER_TYPE}"="stasis"]?failover-stasis)
same => n,Goto(busy-now)
same => n(busy-now),NoOp(Japit all agents busy for queue ${JAPIT_QUEUE_NAME})
; Create/update inbound waiting session so hangup becomes a missed call in the portal.
same => n,UserEvent(JapitAgentsBusy,Did:${JAPIT_DID},CustomerNo:${JAPIT_CUSTOMER_NO},Queue:${JAPIT_QUEUE_NAME},LinkedId:${CHANNEL(linkedid)})
same => n,Set(JAPIT_OVERFLOW_STATUS=JOINEMPTY)
same => n,Goto(overflow-evaluate)
same => n(busy-failover),Set(JAPIT_FAILOVER_TYPE=${ODBC_GET_JAPIT_QUEUE_FAILOVER_TYPE(${JAPIT_QUEUE_NAME},JOINEMPTY)})
same => n,Set(JAPIT_FAILOVER_TARGET=${ODBC_GET_JAPIT_QUEUE_FAILOVER_TARGET(${JAPIT_QUEUE_NAME},JOINEMPTY)})
same => n,ExecIf($["${JAPIT_FAILOVER_TYPE}"=""]?Set(JAPIT_FAILOVER_TYPE=${ODBC_GET_JAPIT_QUEUE_FAILOVER_TYPE(${JAPIT_QUEUE_NAME},default)}))
same => n,ExecIf($["${JAPIT_FAILOVER_TARGET}"=""]?Set(JAPIT_FAILOVER_TARGET=${ODBC_GET_JAPIT_QUEUE_FAILOVER_TARGET(${JAPIT_QUEUE_NAME},default)}))
same => n,ExecIf($["${JAPIT_FAILOVER_TYPE}"=""]?Set(JAPIT_FAILOVER_TYPE=ivr))
; Prefer campaign busy IVR (e.g. airtel_all_agent_busy) over a global default.
same => n,ExecIf($["${JAPIT_FAILOVER_TARGET}"=""]?Set(JAPIT_FAILOVER_TARGET=${ODBC_GET_JAPIT_QUEUE_BUSY_IVR(${JAPIT_QUEUE_NAME})}))
same => n,ExecIf($["${JAPIT_FAILOVER_TARGET}"=""]?Set(JAPIT_FAILOVER_TARGET=japit_all_agents_busy))
; 2-pass busy loop: announce → 30s MOH → announce → thank-you / callback hangup.
; Do not send into generic IVR default (that hung up after the first announce).
same => n,GotoIf($["${JAPIT_FAILOVER_TYPE}"="callback"]?failover-callback)
same => n,GotoIf($["${JAPIT_FAILOVER_TYPE}"="voicemail"]?failover-voicemail)
same => n,Goto(japit-agents-busy-loop,s,1)
same => n(failover-ivr),Set(JAPIT_IVR_CODE=${JAPIT_FAILOVER_TARGET})
same => n,Goto(japit-ivr,s,1)
same => n(failover-extension),Set(JAPIT_TARGET_EXTENSION=${JAPIT_FAILOVER_TARGET})
same => n,Goto(japit-extension-route,s,1)
same => n(failover-voicemail),Set(JAPIT_MAILBOX=${JAPIT_FAILOVER_TARGET})
same => n,Set(JAPIT_VOICEMAIL_SOURCE=queue)
same => n,Goto(japit-voicemail,s,1)
same => n(failover-callback),Set(JAPIT_CALLBACK_QUEUE=${IF($["${JAPIT_FAILOVER_TARGET}"=""]?${JAPIT_QUEUE_NAME}:${JAPIT_FAILOVER_TARGET})})
same => n,ExecIf($["${JAPIT_CALLBACK_QUEUE}"="callback"]?Set(JAPIT_CALLBACK_QUEUE=${JAPIT_QUEUE_NAME}))
same => n,ExecIf($["${JAPIT_CALLBACK_QUEUE}"="callbacks"]?Set(JAPIT_CALLBACK_QUEUE=${JAPIT_QUEUE_NAME}))
same => n,Goto(japit-callback,s,1)
same => n(failover-stasis),Stasis(japit_call_control,${JAPIT_DID},${JAPIT_FAILOVER_TYPE},${JAPIT_FAILOVER_TARGET})
same => n,Hangup()

; ---------------------------------------------------------------------------
; All-agents-busy hold loop (exactly 2 announce passes).
; Pass 1: busy prompt → (optional DTMF) → 30s MOH → recheck ready agents
; Pass 2: busy prompt → (optional DTMF) → thank-you + callback capture → Hangup
; ---------------------------------------------------------------------------
[japit-agents-busy-loop]
exten => s,1,NoOp(Japit agents-busy loop queue=${JAPIT_QUEUE_NAME} target=${JAPIT_FAILOVER_TARGET})
same => n,ExecIf($["${CHANNEL(state)}"!="Up"]?Answer())
same => n,Set(JAPIT_BUSY_IVR=${IF($[${LEN(${JAPIT_FAILOVER_TARGET})}=0]?japit_all_agents_busy:${JAPIT_FAILOVER_TARGET})})
same => n,Set(JAPIT_BUSY_PROMPT=${ODBC_GET_JAPIT_IVR_WELCOME(${JAPIT_BUSY_IVR})})
same => n,ExecIf($["${JAPIT_BUSY_PROMPT}"=""]?Set(JAPIT_BUSY_PROMPT=custom/no_agents_available))
same => n,Set(JAPIT_BUSY_PASS=1)
same => n(announce),NoOp(Japit busy announce pass=${JAPIT_BUSY_PASS} prompt=${JAPIT_BUSY_PROMPT})
same => n,Background(${JAPIT_BUSY_PROMPT})
same => n,WaitExten(5)

exten => t,1,NoOp(Japit busy announce timeout pass=${JAPIT_BUSY_PASS})
same => n,Goto(s,after-announce)

exten => i,1,NoOp(Japit busy announce invalid digit)
same => n,Goto(s,after-announce)

; Digit options from the busy IVR (e.g. callback) still work during either pass.
exten => _X,1,NoOp(Japit busy digit ${EXTEN} for ${JAPIT_BUSY_IVR})
same => n,Set(JAPIT_IVR_DIGIT=${EXTEN})
same => n,Set(JAPIT_ACTION_TYPE=${ODBC_GET_JAPIT_IVR_ACTION_TYPE(${JAPIT_BUSY_IVR},${EXTEN})})
same => n,Set(JAPIT_ACTION_TARGET=${ODBC_GET_JAPIT_IVR_ACTION_TARGET(${JAPIT_BUSY_IVR},${EXTEN})})
same => n,GotoIf($[${LEN(${JAPIT_ACTION_TYPE})}=0]?s,after-announce)
same => n,Goto(japit-ivr-dispatch,s,1)

exten => s,10(after-announce),NoOp(Japit busy after-announce pass=${JAPIT_BUSY_PASS})
same => n,GotoIf($[${JAPIT_BUSY_PASS} >= 2]?goodbye)
; Between passes: hold music, then re-check whether an agent became ready.
same => n,MusicOnHold(default,30)
same => n,Set(JAPIT_Q_READY=${QUEUE_MEMBER(${JAPIT_QUEUE_NAME},ready)})
same => n,NoOp(Japit busy mid-loop ready_members=${JAPIT_Q_READY})
same => n,GotoIf($[${JAPIT_Q_READY} > 0]?requeue)
same => n,Set(JAPIT_BUSY_PASS=$[${JAPIT_BUSY_PASS} + 1])
same => n,Goto(s,announce)
same => n(requeue),NoOp(Japit busy loop requeue — agent became ready)
same => n,Goto(japit-queue,s,1)
same => n(goodbye),NoOp(Japit busy loop goodbye — create callback then thank-you hangup)
same => n,Set(JAPIT_CALLBACK_QUEUE=${JAPIT_QUEUE_NAME})
same => n,Goto(japit-callback,s,1)

; ---------------------------------------------------------------------------
; Entry announcement only. Queue() supplies native position and hold-time
; announcements at the realtime queue's 45-second announce_frequency.
; CURL failures deliberately use a harmless built-in prompt and return.
; ---------------------------------------------------------------------------
[japit-queue-announce]
exten => s,1,NoOp(Japit queue EWT announcement queue=${JAPIT_QUEUE_NAME} position=${JAPIT_Q_POSITION})
same => n,Set(JAPIT_Q_WELCOME=${ODBC_GET_JAPIT_QUEUE_WELCOME(${JAPIT_QUEUE_NAME})})
same => n,ExecIf($[${LEN(${JAPIT_Q_WELCOME})}>0]?Playback(${JAPIT_Q_WELCOME}))
same => n,Set(JAPIT_ENGINE_URL=${ODBC_GET_JAPIT_ROUTING_ENGINE_BASE_URL()})
same => n,GotoIf($["${JAPIT_ENGINE_URL}"=""]?fallback)
same => n,Set(CURLOPT(httptimeout)=1)
same => n,Set(JAPIT_EWT_RAW=${CURL(${JAPIT_ENGINE_URL}/api/v1/telephony/queue/ewt/decide-simple?queue_name=${JAPIT_QUEUE_NAME}&position=${JAPIT_Q_POSITION}&waiting_count=${JAPIT_Q_WAITING})})
same => n,Set(JAPIT_EWT_STATUS=${CUT(JAPIT_EWT_RAW,|,1)})
same => n,GotoIf($["${JAPIT_EWT_STATUS}"!="ok"]?fallback)
same => n,Set(JAPIT_EWT_SECONDS=${CUT(JAPIT_EWT_RAW,|,2)})
same => n,Set(JAPIT_EWT_POSITION=${CUT(JAPIT_EWT_RAW,|,3)})
same => n,GotoIf($[${LEN(${JAPIT_EWT_SECONDS})}=0]?fallback)
same => n,Set(JAPIT_EWT_MINUTES=$[(${JAPIT_EWT_SECONDS} + 59) / 60])
same => n,Playback(queue-thankyou)
same => n,SayNumber(${JAPIT_EWT_POSITION})
same => n,Playback(queue-holdtime)
same => n,SayNumber(${JAPIT_EWT_MINUTES})
same => n,Playback(queue-minutes)
same => n,Return()
same => n(fallback),NoOp(Japit queue EWT unavailable; retain queue flow)
same => n,Playback(queue-thankyou)
same => n,Return()

[japit-extension-route]
exten => s,1,NoOp(Japit extension route ${JAPIT_TARGET_EXTENSION})
same => n,GotoIf($["${GLOBAL(JAPIT_BRIDGE_RING)}"="${JAPIT_TARGET_EXTENSION}"]?bridge-wait)
same => n,GotoIf($["${JAPIT_BRIDGE_CONNECT}"="1"]?bridge-wait)
same => n,GotoIf($["${CALLERID(num)}"="${JAPIT_TARGET_EXTENSION}"]?bridge-wait)
same => n,Set(JAPIT_DIAL_TARGET=${ODBC_GET_JAPIT_EXTENSION_DIAL_TARGET(${JAPIT_TARGET_EXTENSION})})
same => n,Set(JAPIT_DIAL_TIMEOUT=${ODBC_GET_JAPIT_EXTENSION_TIMEOUT(${JAPIT_TARGET_EXTENSION})})
same => n,Set(JAPIT_DIAL_TIMEOUT=${IF($[${LEN(${JAPIT_DIAL_TIMEOUT})}=0]?30:${JAPIT_DIAL_TIMEOUT})})
same => n,Set(JAPIT_DIAL_CONTACT=${PJSIP_DIAL_CONTACTS(${JAPIT_TARGET_EXTENSION})})
same => n,ExecIf($[${LEN(${JAPIT_DIAL_CONTACT})}>0]?Set(JAPIT_DIAL_TARGET=${CUT(JAPIT_DIAL_CONTACT,,)}))
same => n,Set(PJSIP_HEADER(add,X-Japit-Customer-No)=${IF($[${LEN(${JAPIT_CUSTOMER_NO})}>0]?${FILTER(0123456789,${JAPIT_CUSTOMER_NO})}:${FILTER(0123456789,${CALLERID(num)})})})
same => n,Set(PJSIP_HEADER(add,X-Japit-Direction)=inbound)
same => n,Dial(${JAPIT_DIAL_TARGET},${JAPIT_DIAL_TIMEOUT},tT)
same => n,Hangup()
exten => s,n(bridge-wait),NoOp(Japit deskphone bridge route hold ${JAPIT_TARGET_EXTENSION})
same => n,Wait(120)
same => n,Hangup()

[japit-queue-member-originate]
exten => s,1,NoOp(Japit queue member originate sticky=${JAPIT_STICKY_MODE})
same => n,GotoIf($["${JAPIT_STICKY_MODE}"!="1"]?headers)
same => n,GotoIf($[${LEN(${MEMBERINTERFACE})}=0]?headers)
same => n,Set(JAPIT_MEMBER_EXT=${CUT(CUT(MEMBERINTERFACE,/,2),@,1)})
same => n,GotoIf($["${JAPIT_MEMBER_EXT}"="${JAPIT_STICKY_EXTEN}"]?headers)
same => n,Hangup()
same => n(headers),Set(PJSIP_HEADER(add,X-Japit-Customer-No)=${IF($[${LEN(${JAPIT_CUSTOMER_NO})}>0]?${FILTER(0123456789,${JAPIT_CUSTOMER_NO})}:${FILTER(0123456789,${CALLERID(num)})})})
same => n,Set(PJSIP_HEADER(add,X-Japit-Direction)=inbound)
same => n,Return()

[japit-callback]
exten => s,1,NoOp(Japit callback capture queue ${JAPIT_CALLBACK_QUEUE})
same => n,GotoIf($["${JAPIT_CALLBACK_DONE}"="1"]?hangup)
same => n,ExecIf($["${CHANNEL(state)}"!="Up"]?Answer())
same => n,Set(JAPIT_CALLBACK_QUEUE=${IF($["${JAPIT_CALLBACK_QUEUE}"=""]?${JAPIT_QUEUE_NAME}:${JAPIT_CALLBACK_QUEUE})})
same => n,ExecIf($["${JAPIT_CALLBACK_QUEUE}"="callback"]?Set(JAPIT_CALLBACK_QUEUE=${JAPIT_QUEUE_NAME}))
same => n,ExecIf($["${JAPIT_CALLBACK_QUEUE}"="callbacks"]?Set(JAPIT_CALLBACK_QUEUE=${JAPIT_QUEUE_NAME}))
same => n,ExecIf($[${LEN(${JAPIT_QUEUE_NAME})}>0]?Set(JAPIT_CALLBACK_QUEUE=${JAPIT_QUEUE_NAME}))
same => n,Set(JAPIT_CUSTOMER_NO=${FILTER(0123456789,${JAPIT_CUSTOMER_NO})})
same => n,ExecIf($[${LEN(${JAPIT_CUSTOMER_NO})}=0]?Set(JAPIT_CUSTOMER_NO=${FILTER(0123456789,${CALLERID(num)})}))
same => n,Set(JAPIT_ENGINE_URL=${ODBC_GET_JAPIT_ROUTING_ENGINE_BASE_URL()})
same => n,GotoIf($["${JAPIT_ENGINE_URL}"=""]?legacy-odbc)
same => n,Set(CURLOPT(httptimeout)=2)
same => n,Set(JAPIT_CALLBACK_RAW=${CURL(${JAPIT_ENGINE_URL}/api/v1/telephony/callbacks/create-simple?queue_name=${JAPIT_CALLBACK_QUEUE}&ani=${JAPIT_CUSTOMER_NO}&cli=${CALLERID(num)}&wait_seconds=$[${EPOCH}-${JAPIT_QUEUE_ENTER_EPOCH}]&linkedid=${CHANNEL(linkedid)}&did=${JAPIT_DID})})
same => n,Set(JAPIT_CALLBACK_STATUS=${CUT(JAPIT_CALLBACK_RAW,|,1)})
same => n,Set(JAPIT_CALLBACK_ID=${CUT(JAPIT_CALLBACK_RAW,|,2)})
same => n,GotoIf($["${JAPIT_CALLBACK_STATUS}"="ok"]?created)
same => n(legacy-odbc),Set(JAPIT_CALLBACK_ID=${ODBC_ADD_JAPIT_CALLBACK(${JAPIT_CUSTOMER_NO},${JAPIT_DID},${JAPIT_CALLBACK_QUEUE},${CHANNEL(linkedid)})})
same => n,GotoIf($[${LEN(${JAPIT_CALLBACK_ID})}=0]?fail)
same => n(created),Set(__JAPIT_CALLBACK_DONE=1)
same => n,UserEvent(JapitCallbackRequested,Did:${JAPIT_DID},CustomerNo:${JAPIT_CUSTOMER_NO},Queue:${JAPIT_CALLBACK_QUEUE},CallbackId:${JAPIT_CALLBACK_ID},LinkedId:${CHANNEL(linkedid)})
same => n,NoOp(Japit callback created id=${JAPIT_CALLBACK_ID} queue=${JAPIT_CALLBACK_QUEUE} linked=${CHANNEL(linkedid)})
; Thank-you only after successful ODBC create — then clean hangup (no return to IVR/queue).
same => n,Playback(auth-thankyou)
same => n(hangup),Hangup()
same => n(fail),NoOp(Japit callback create failed queue=${JAPIT_CALLBACK_QUEUE} customer=${JAPIT_CUSTOMER_NO})
same => n,UserEvent(JapitCallbackFailed,Did:${JAPIT_DID},CustomerNo:${JAPIT_CUSTOMER_NO},Queue:${JAPIT_CALLBACK_QUEUE},LinkedId:${CHANNEL(linkedid)})
same => n,Playback(beeperr)
same => n,Hangup()

[japit-queue-dtmf]
; Queue() transfers caller input here when realtime queue context is enabled.
exten => 1,1,NoOp(Callback offer accepted queue=${JAPIT_QUEUE_NAME})
same => n,Set(JAPIT_CALLBACK_WAIT_SECONDS=$[${EPOCH}-${JAPIT_QUEUE_ENTER_EPOCH}])
same => n,Set(JAPIT_CALLBACK_ANI=${FILTER(0123456789,${CALLERID(num)})})
same => n,UserEvent(JapitCallbackOfferAccepted,Queue:${JAPIT_QUEUE_NAME},Ani:${JAPIT_CALLBACK_ANI},Did:${JAPIT_DID},WaitSeconds:${JAPIT_CALLBACK_WAIT_SECONDS},LinkedId:${CHANNEL(linkedid)})
same => n,Set(CDR(userfield)=callback_offer:${JAPIT_QUEUE_NAME}:wait=${JAPIT_CALLBACK_WAIT_SECONDS})
same => n,CELGenUserEvent(JAPIT_CALLBACK_OFFER_ACCEPTED,Extra:queue=${JAPIT_QUEUE_NAME}\;wait=${JAPIT_CALLBACK_WAIT_SECONDS}\;linkedid=${CHANNEL(linkedid)})
same => n,Set(JAPIT_ENGINE_URL=${ODBC_GET_JAPIT_ROUTING_ENGINE_BASE_URL()})
same => n,GotoIf($["${JAPIT_ENGINE_URL}"=""]?failed)
same => n,Set(CURLOPT(httptimeout)=2)
same => n,Set(JAPIT_CALLBACK_RAW=${CURL(${JAPIT_ENGINE_URL}/api/v1/telephony/callbacks/create-simple?queue_name=${JAPIT_QUEUE_NAME}&ani=${JAPIT_CALLBACK_ANI}&cli=${JAPIT_CALLBACK_ANI}&wait_seconds=${JAPIT_CALLBACK_WAIT_SECONDS}&linkedid=${CHANNEL(linkedid)}&did=${JAPIT_DID})})
same => n,Set(JAPIT_CALLBACK_STATUS=${CUT(JAPIT_CALLBACK_RAW,|,1)})
same => n,Set(JAPIT_CALLBACK_ID=${CUT(JAPIT_CALLBACK_RAW,|,2)})
same => n,GotoIf($["${JAPIT_CALLBACK_STATUS}"!="ok"]?failed)
same => n,UserEvent(JapitCallbackCreated,Queue:${JAPIT_QUEUE_NAME},CallbackId:${JAPIT_CALLBACK_ID},LinkedId:${CHANNEL(linkedid)})
same => n,Playback(auth-thankyou)
same => n,Hangup()
same => n(failed),Set(JAPIT_CALLBACK_REASON=${CUT(JAPIT_CALLBACK_RAW,|,2)})
same => n,UserEvent(JapitCallbackFailed,Queue:${JAPIT_QUEUE_NAME},Reason:${JAPIT_CALLBACK_REASON},LinkedId:${CHANNEL(linkedid)})
same => n,Playback(beeperr)
; A failure means no callback exists, so preserve the caller by returning to Queue().
same => n,Goto(japit-queue,s,1)

exten => _X,1,NoOp(Callback offer rejected digit=${EXTEN} queue=${JAPIT_QUEUE_NAME})
same => n,UserEvent(JapitCallbackOfferRejected,Queue:${JAPIT_QUEUE_NAME},Digit:${EXTEN},LinkedId:${CHANNEL(linkedid)})
same => n,Set(CDR(userfield)=callback_reject:${JAPIT_QUEUE_NAME}:digit=${EXTEN})
same => n,Set(CDR(accountcode)=callback_reject)
same => n,CELGenUserEvent(JAPIT_CALLBACK_OFFER_REJECTED,Extra:queue=${JAPIT_QUEUE_NAME}\;digit=${EXTEN}\;linkedid=${CHANNEL(linkedid)})
same => n,Goto(japit-queue,s,1)

[japit-callback-offer-announce]
; Dialplan-testable fallback. Queue() periodic-announce plays a sound prompt with
; this name; deploy the matching sound under Asterisk's sounds directory.
exten => s,1,NoOp(Callback offer played queue=${JAPIT_QUEUE_NAME})
same => n,UserEvent(JapitCallbackOfferPlayed,Queue:${JAPIT_QUEUE_NAME},LinkedId:${CHANNEL(linkedid)})
same => n,Set(CDR(userfield)=callback_offered:${JAPIT_QUEUE_NAME})
same => n,CELGenUserEvent(JAPIT_CALLBACK_OFFERED,Extra:queue=${JAPIT_QUEUE_NAME}\;linkedid=${CHANNEL(linkedid)})
same => n,Playback(silence/1)
same => n,SayNumber(1)
same => n,Playback(queue-thankyou)
same => n,Return()

[japit-voicemail]
exten => s,1,NoOp(Japit voicemail mailbox ${JAPIT_MAILBOX})
same => n,ExecIf($["${CHANNEL(state)}"!="Up"]?Answer())
same => n,Set(JAPIT_VM_CUSTOMER=${FILTER(0123456789,${JAPIT_CUSTOMER_NO})})
same => n,ExecIf($[${LEN(${JAPIT_VM_CUSTOMER})}=0]?Set(JAPIT_VM_CUSTOMER=unknown))
same => n,Set(JAPIT_VM_DID=${FILTER(0123456789,${JAPIT_DID})})
same => n,ExecIf($[${LEN(${JAPIT_VM_DID})}=0]?Set(JAPIT_VM_DID=unknown))
same => n,ExecIf($["${JAPIT_CAMPAIGN_NAMESPACE}"=""]?Set(JAPIT_CAMPAIGN_NAMESPACE=default))
same => n,Set(JAPIT_VM_ENABLED=${ODBC_GET_JAPIT_VM_ENABLED(${JAPIT_MAILBOX})})
same => n,GotoIf($["${JAPIT_VM_ENABLED}"="1"]?native)
same => n,Set(JAPIT_VM_DATE=${STRFTIME(${EPOCH},,%Y-%m-%d)})
same => n,Set(JAPIT_VM_DIR=/var/spool/asterisk/voicemail/default/japit/${JAPIT_CAMPAIGN_NAMESPACE}/${JAPIT_VM_DID}/${JAPIT_VM_DATE}/${JAPIT_VM_CUSTOMER})
same => n,System(mkdir -p '${JAPIT_VM_DIR}')
same => n,Set(JAPIT_VM_FILE=${JAPIT_VM_DIR}/${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${UNIQUEID}.wav)
; Hangup during Record skips later priorities — hangup handler emits UserEvent.
same => n,Set(CHANNEL(hangup_handler_push)=japit-voicemail-saved,s,1)
same => n,Playback(beep)
same => n,Record(${JAPIT_VM_FILE},30,120,kq)
same => n,Hangup()
same => n(native),NoOp(Japit native VoiceMail ${JAPIT_MAILBOX}@japit)
same => n,Set(JAPIT_VOICEMAIL_SOURCE=mailbox)
same => n,Set(JAPIT_VM_DIR=/var/spool/asterisk/voicemail/japit/${JAPIT_MAILBOX}/INBOX)
same => n,Set(JAPIT_VM_FILE=${JAPIT_VM_DIR})
same => n,Set(CHANNEL(hangup_handler_push)=japit-voicemail-saved,s,1)
same => n,VoiceMail(${JAPIT_MAILBOX}@japit,u)
same => n,Hangup()

[japit-voicemail-saved]
exten => s,1,NoOp(Japit voicemail saved ${JAPIT_VM_FILE})
same => n,GotoIf($["${JAPIT_VM_SAVED}"="1"]?done)
same => n,Set(JAPIT_VM_SAVED=1)
same => n,UserEvent(JapitVoicemailSaved,Campaign:${JAPIT_CAMPAIGN_NAMESPACE},Did:${JAPIT_VM_DID},CustomerNo:${JAPIT_VM_CUSTOMER},Mailbox:${JAPIT_MAILBOX},Source:${JAPIT_VOICEMAIL_SOURCE},Path:${JAPIT_VM_FILE},LinkedId:${CHANNEL(linkedid)})
same => n(done),Return()

; ---------------------------------------------------------------------------
; AST-06: PSTN dial with primary → secondary trunk failover.
; ARG1 = dialed number, ARG2 = timeout seconds, ARG3 = Dial() options string.
; Retries only on CHANUNAVAIL / CONGESTION. Established media on primary is unchanged.
; AST-29: optional LCR after toll-fraud sets JAPIT_TRUNK_* from eligible providers.
; CURL failure or skip keeps AST-06 Mediant / Mediant-Secondary defaults.
; ---------------------------------------------------------------------------
[japit-pstn-dial]
exten => s,1,NoOp(Japit PSTN dial ${ARG1} primary=${JAPIT_TRUNK_PRIMARY} secondary=${JAPIT_TRUNK_SECONDARY})
same => n,Set(JAPIT_TRUNK_PRIMARY=${IF($[${LEN(${JAPIT_TRUNK_PRIMARY})}=0]?Mediant:${JAPIT_TRUNK_PRIMARY})})
same => n,Set(JAPIT_TRUNK_SECONDARY=${IF($[${LEN(${JAPIT_TRUNK_SECONDARY})}=0]?Mediant-Secondary:${JAPIT_TRUNK_SECONDARY})})
same => n,Set(JAPIT_PSTN_NUM=${ARG1})
same => n,Set(JAPIT_PSTN_TIMEOUT=${IF($[${LEN(${ARG2})}=0]?60:${ARG2})})
same => n,Set(JAPIT_PSTN_OPTS=${ARG3})
; AST-15: toll-fraud guard before any trunk Dial (emergency bypass handled by policy).
same => n,Gosub(japit-tollfraud-check,s,1(${JAPIT_PSTN_NUM},${JAPIT_AGENT_EXT}))
; AST-29: provider selection after toll-fraud. Fail-open to AST-06 defaults.
same => n,GotoIf($["${JAPIT_IS_EMERGENCY}"="1"]?lcr-skip)
same => n,Set(JAPIT_LCR_RAW=${CURL(${JAPIT_ENGINE_URL}/api/v1/telephony/sip/providers/decide-simple?destination=${FILTER(0123456789,${JAPIT_PSTN_NUM})}&emergency=0&linkedid=${CHANNEL(linkedid)})})
same => n,Set(JAPIT_LCR_STATUS=${CUT(JAPIT_LCR_RAW,|,1)})
same => n,GotoIf($["${JAPIT_LCR_STATUS}"!="ok"]?lcr-skip)
same => n,Set(JAPIT_TRUNK_PRIMARY=${CUT(JAPIT_LCR_RAW,|,2)})
same => n,Set(JAPIT_TRUNK_SECONDARY=${IF($[${LEN(${CUT(JAPIT_LCR_RAW,|,3)})}=0]?${JAPIT_TRUNK_SECONDARY}:${CUT(JAPIT_LCR_RAW,|,3)})})
same => n,Set(JAPIT_TRUNK_TERTIARY=${CUT(JAPIT_LCR_RAW,|,4)})
same => n,Set(JAPIT_SIP_POLICY=${CUT(JAPIT_LCR_RAW,|,5)})
same => n,Set(JAPIT_SIP_PROVIDER=${CUT(JAPIT_LCR_RAW,|,6)})
same => n,UserEvent(JapitProviderSelected,Provider:${JAPIT_SIP_PROVIDER},Primary:${JAPIT_TRUNK_PRIMARY},Secondary:${JAPIT_TRUNK_SECONDARY},Policy:${JAPIT_SIP_POLICY},LinkedId:${CHANNEL(linkedid)})
same => n(lcr-skip),Set(JAPIT_TRUNK_USED=${JAPIT_TRUNK_PRIMARY})
same => n,Dial(PJSIP/${JAPIT_PSTN_NUM}@${JAPIT_TRUNK_PRIMARY},${JAPIT_PSTN_TIMEOUT},${JAPIT_PSTN_OPTS})
same => n,GotoIf($["${DIALSTATUS}"="ANSWER"]?done)
same => n,GotoIf($["${DIALSTATUS}"="CANCEL"]?done)
same => n,GotoIf($["${DIALSTATUS}"="BUSY"]?done)
same => n,GotoIf($["${DIALSTATUS}"="NOANSWER"]?done)
same => n,GotoIf($["${DIALSTATUS}"!="CHANUNAVAIL" & "${DIALSTATUS}"!="CONGESTION"]?done)
same => n,NoOp(Japit trunk primary failed status=${DIALSTATUS}; trying secondary)
same => n,Set(JAPIT_TRUNK_USED=${JAPIT_TRUNK_SECONDARY})
same => n,Set(CDR(userfield)=trunk_failover:${JAPIT_TRUNK_PRIMARY}>${JAPIT_TRUNK_SECONDARY}:status=${DIALSTATUS})
same => n,CELGenUserEvent(JAPIT_TRUNK_FAILOVER,Extra:from=${JAPIT_TRUNK_PRIMARY}\;to=${JAPIT_TRUNK_SECONDARY}\;status=${DIALSTATUS})
same => n,UserEvent(JapitTrunkFailover,From:${JAPIT_TRUNK_PRIMARY},To:${JAPIT_TRUNK_SECONDARY},DialStatus:${DIALSTATUS},Number:${JAPIT_PSTN_NUM},LinkedId:${CHANNEL(linkedid)})
same => n,UserEvent(JapitProviderFailover,From:${JAPIT_TRUNK_PRIMARY},To:${JAPIT_TRUNK_SECONDARY},DialStatus:${DIALSTATUS},Attempt:2,LinkedId:${CHANNEL(linkedid)})
same => n,Dial(PJSIP/${JAPIT_PSTN_NUM}@${JAPIT_TRUNK_SECONDARY},${JAPIT_PSTN_TIMEOUT},${JAPIT_PSTN_OPTS})
same => n,GotoIf($["${DIALSTATUS}"="ANSWER"]?done)
same => n,GotoIf($["${DIALSTATUS}"="CANCEL"]?done)
same => n,GotoIf($["${DIALSTATUS}"="BUSY"]?done)
same => n,GotoIf($["${DIALSTATUS}"="NOANSWER"]?done)
same => n,GotoIf($["${DIALSTATUS}"!="CHANUNAVAIL" & "${DIALSTATUS}"!="CONGESTION"]?done)
same => n,GotoIf($[${LEN(${JAPIT_TRUNK_TERTIARY})}=0]?done)
same => n,GotoIf($["${JAPIT_TRUNK_TERTIARY}"="${JAPIT_TRUNK_PRIMARY}"]?done)
same => n,GotoIf($["${JAPIT_TRUNK_TERTIARY}"="${JAPIT_TRUNK_SECONDARY}"]?done)
same => n,NoOp(Japit trunk secondary failed status=${DIALSTATUS}; trying tertiary)
same => n,Set(JAPIT_TRUNK_USED=${JAPIT_TRUNK_TERTIARY})
same => n,Set(CDR(userfield)=trunk_failover:${JAPIT_TRUNK_SECONDARY}>${JAPIT_TRUNK_TERTIARY}:status=${DIALSTATUS})
same => n,CELGenUserEvent(JAPIT_TRUNK_FAILOVER,Extra:from=${JAPIT_TRUNK_SECONDARY}\;to=${JAPIT_TRUNK_TERTIARY}\;status=${DIALSTATUS})
same => n,UserEvent(JapitTrunkFailover,From:${JAPIT_TRUNK_SECONDARY},To:${JAPIT_TRUNK_TERTIARY},DialStatus:${DIALSTATUS},Number:${JAPIT_PSTN_NUM},LinkedId:${CHANNEL(linkedid)})
same => n,UserEvent(JapitProviderFailover,From:${JAPIT_TRUNK_SECONDARY},To:${JAPIT_TRUNK_TERTIARY},DialStatus:${DIALSTATUS},Attempt:3,LinkedId:${CHANNEL(linkedid)})
same => n,Dial(PJSIP/${JAPIT_PSTN_NUM}@${JAPIT_TRUNK_TERTIARY},${JAPIT_PSTN_TIMEOUT},${JAPIT_PSTN_OPTS})
same => n(done),NoOp(Japit PSTN dial complete trunk=${JAPIT_TRUNK_USED} status=${DIALSTATUS})
same => n,Return()

[japit-callback-originate]
; AST-16: scheduled callback auto-dial template (AMI Local/{num}@japit-callback-originate).
; Preserves campaign CLI, logical_call_id, original call linkage, then
; reuses japit-app-outbound → japit-pstn-dial (AST-06 failover + AST-15 toll-fraud).
; AST-22: do NOT run AMD() here (no far-end audio yet). Inherit JAPIT_AMD_* into
; japit-app-outbound; detection runs after PSTN answer in [japit-join-conf].
exten => _X.,1,NoOp(Japit callback originate ${EXTEN} cb=${JAPIT_CALLBACK_ID} logical=${JAPIT_LOGICAL_CALL_ID})
same => n,Set(JAPIT_CHAN_NAME=${CHANNEL(name)})
same => n,Set(JAPIT_CHAN_SAFE=${REPLACE(JAPIT_CHAN_NAME,\;)})
same => n,GotoIf($["${JAPIT_CHAN_SAFE:-1}"="1"]?hangup-aux)
same => n,ExecIf($[${LEN(${JAPIT_DID})}<8 & ${LEN(${JAPIT_CALLBACK_CLI})}>0]?Set(JAPIT_DID=${JAPIT_CALLBACK_CLI}))
same => n,Set(CDR(userfield)=callback:${JAPIT_CALLBACK_ID}:orig=${JAPIT_ORIGINAL_CALL_SESSION_ID}:logical=${JAPIT_LOGICAL_CALL_ID}:attempt=${JAPIT_CALLBACK_ATTEMPT})
same => n,Set(CDR(accountcode)=callback_auto)
same => n,CELGenUserEvent(JAPIT_CALLBACK_ORIGINATE,Extra:callback_id=${JAPIT_CALLBACK_ID}\;logical=${JAPIT_LOGICAL_CALL_ID}\;campaign=${JAPIT_CAMPAIGN_NAMESPACE}\;node=${JAPIT_ASTERISK_NODE_ID}\;attempt=${JAPIT_CALLBACK_ATTEMPT})
same => n,UserEvent(JapitCallbackOriginate,CallbackId:${JAPIT_CALLBACK_ID},LogicalCallId:${JAPIT_LOGICAL_CALL_ID},Campaign:${JAPIT_CAMPAIGN_NAMESPACE},Node:${JAPIT_ASTERISK_NODE_ID},LinkedId:${CHANNEL(linkedid)})
same => n,Goto(japit-app-outbound,${EXTEN},1)
same => n(hangup-aux),NoOp(Japit callback auxiliary Local leg)
same => n,Hangup()

[japit-app-outbound]
exten => _X.,1,NoOp(Japit outbound origination ${EXTEN} channel ${CHANNEL(name)})
; Local/;1 must not Dial — strip ';' before compare ('; ';' in dialplan is a comment).
same => n,Set(JAPIT_CHAN_NAME=${CHANNEL(name)})
same => n,Set(JAPIT_CHAN_SAFE=${REPLACE(JAPIT_CHAN_NAME,\;)})
same => n,GotoIf($["${JAPIT_CHAN_SAFE:-1}"="1"]?hangup-aux)
same => n,Set(JAPIT_DIALED_NUMBER=${FILTER(0123456789+,${EXTEN})})
same => n,Set(NUM=${JAPIT_DIALED_NUMBER})
same => n,ExecIf($["${NUM:0:1}"="+"]?Set(NUM=${NUM:1}))
same => n,ExecIf($["${NUM:0:2}"="91"]?Set(NUM=${NUM:2}))
; AST-14: detect emergency BEFORE local PSTN 0-prefix normalization.
same => n,Gosub(japit-emergency-detect,s,1(${FILTER(0123456789,${NUM})}))
same => n,GotoIf($["${JAPIT_IS_EMERGENCY}"="1"]?japit-emergency,${FILTER(0123456789,${NUM})},1)
same => n,ExecIf($["${NUM:0:1}"!="0"]?Set(NUM=0${NUM}))
same => n,NoOp(Japit final outbound number ${NUM})
same => n,GotoIf($["${JAPIT_AGENT_EXT}"=""]?missing-agent,1)
same => n,ExecIf($["${JAPIT_QUEUE_NAME}"=""]?Set(JAPIT_QUEUE_NAME=${ODBC_GET_JAPIT_AGENT_QUEUE(${JAPIT_AGENT_EXT})}))
same => n,ExecIf($["${JAPIT_CAMPAIGN_NAMESPACE}"=""]?Set(JAPIT_CAMPAIGN_NAMESPACE=${ODBC_GET_JAPIT_AGENT_CAMPAIGN_NAMESPACE(${JAPIT_AGENT_EXT})}))
; Keep AMI/portal DID when already set; never let a short extension overwrite a real PSTN DID.
same => n,ExecIf($[${LEN(${JAPIT_DID})}<8]?Set(JAPIT_DID=${ODBC_GET_JAPIT_OUTBOUND_DID(${JAPIT_AGENT_EXT})}))
same => n,ExecIf($[${LEN(${JAPIT_DID})}<8]?Set(JAPIT_DID=${ODBC_GET_JAPIT_AGENT_CAMPAIGN_DID(${JAPIT_AGENT_EXT})}))
same => n,ExecIf($[${LEN(${JAPIT_DID})}<8]?Set(JAPIT_DID=914049583230))
same => n,Set(__JAPIT_CUSTOMER_NO=${FILTER(0123456789,${NUM})})
same => n,Set(__JAPIT_DIRECTION=outbound)
; Inherit onto Mediant leg so japit-join-conf UserEvent / AST-22 AMD can read them.
same => n,Set(__JAPIT_DID=${JAPIT_DID})
same => n,Set(__JAPIT_QUEUE_NAME=${JAPIT_QUEUE_NAME})
same => n,Set(__JAPIT_CAMPAIGN_NAMESPACE=${JAPIT_CAMPAIGN_NAMESPACE})
same => n,Set(__JAPIT_AMD_ENABLED=${JAPIT_AMD_ENABLED})
same => n,Set(__JAPIT_AMD_PROFILE=${JAPIT_AMD_PROFILE})
same => n,Set(__JAPIT_AMD_ACTION=${JAPIT_AMD_ACTION})
same => n,Set(__JAPIT_AMD_UNKNOWN_ACTION=${JAPIT_AMD_UNKNOWN_ACTION})
same => n,Set(__JAPIT_AMD_SOURCE=${JAPIT_AMD_SOURCE})
same => n,Set(__JAPIT_AMD_INITIAL_SILENCE=${JAPIT_AMD_INITIAL_SILENCE})
same => n,Set(__JAPIT_AMD_GREETING=${JAPIT_AMD_GREETING})
same => n,Set(__JAPIT_AMD_AFTER_GREETING_SILENCE=${JAPIT_AMD_AFTER_GREETING_SILENCE})
same => n,Set(__JAPIT_AMD_TOTAL_ANALYSIS_TIME=${JAPIT_AMD_TOTAL_ANALYSIS_TIME})
same => n,Set(__JAPIT_AMD_MIN_WORD_LENGTH=${JAPIT_AMD_MIN_WORD_LENGTH})
same => n,Set(__JAPIT_AMD_BETWEEN_WORDS_SILENCE=${JAPIT_AMD_BETWEEN_WORDS_SILENCE})
same => n,Set(__JAPIT_AMD_MAXIMUM_NUMBER_OF_WORDS=${JAPIT_AMD_MAXIMUM_NUMBER_OF_WORDS})
same => n,Set(__JAPIT_AMD_SILENCE_THRESHOLD=${JAPIT_AMD_SILENCE_THRESHOLD})
same => n,Set(__JAPIT_AMD_MAXIMUM_WORD_LENGTH=${JAPIT_AMD_MAXIMUM_WORD_LENGTH})
same => n,Set(__JAPIT_CALL_SESSION_ID=${JAPIT_CALL_SESSION_ID})
same => n,Set(__JAPIT_LOGICAL_CALL_ID=${JAPIT_LOGICAL_CALL_ID})
same => n,Set(__JAPIT_LEAD_ID=${JAPIT_LEAD_ID})
same => n,Set(__JAPIT_CAMPAIGN_ID=${JAPIT_CAMPAIGN_ID})
same => n,Set(__JAPIT_CALLBACK_ID=${JAPIT_CALLBACK_ID})
same => n,Set(__JAPIT_ASTERISK_NODE_ID=${JAPIT_ASTERISK_NODE_ID})
same => n,Set(CHANNEL(hangup_handler_push)=japit-recording-hangup,s,1)
same => n,Set(CHANNEL(hangup_handler_push)=japit-rtp-qos-hangup,s,1)
; PSTN CLI must be the outbound DID — extension numbers (e.g. 1016) cause carrier drop after answer.
same => n,Set(CALLERID(num)=${JAPIT_DID})
same => n,Set(JAPIT_ORIG_EVENT_ID=${ODBC_LOG_JAPIT_ORIGINATION_EVENT(${CHANNEL(linkedid)},${JAPIT_AGENT_EXT},${JAPIT_CUSTOMER_NO},${NUM},${JAPIT_DID},${JAPIT_QUEUE_NAME},${JAPIT_CAMPAIGN_NAMESPACE},ami,requested)})
same => n,UserEvent(JapitOriginationRequested,AgentExt:${JAPIT_AGENT_EXT},CustomerNo:${JAPIT_CUSTOMER_NO},DialedNumber:${NUM},Did:${JAPIT_DID},Queue:${JAPIT_QUEUE_NAME},Campaign:${JAPIT_CAMPAIGN_NAMESPACE},EventId:${JAPIT_ORIG_EVENT_ID},LinkedId:${CHANNEL(linkedid)})
same => n,Set(JAPIT_REC_STEM=${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-japit-out-${CHANNEL(linkedid)})
same => n,MixMonitor(/var/spool/asterisk/monitor/${JAPIT_REC_STEM}.wav,b)
; Dial options are a SINGLE 3rd arg — must be tTU(...) not tT,U(...) (comma → URL, U never runs).
; U(x[^arg...]) gosubs to context x, extension s, priority 1 with ARG1=arg (NOT context^exten^priority).
; `r` = local ringback to agent (no Mediant early media). WebRTC DTLS often cannot forward
; early voice (app_dial "Unable to forward frametype: 2") and that race cancelled Dial.
same => n,Gosub(japit-pstn-dial,s,1(${NUM},60,rtTU(japit-join-conf^${JAPIT_AGENT_EXT})))
same => n,Hangup()

exten => _X.,n(hangup-aux),NoOp(Japit outbound auxiliary Local leg - skip duplicate dial)
same => n,Hangup()

exten => missing-agent,1,NoOp(Japit outbound missing agent extension for ${JAPIT_DIALED_NUMBER})
same => n,Hangup(21)

