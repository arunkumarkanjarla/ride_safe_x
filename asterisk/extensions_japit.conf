same => n,UserEvent(JapitRecordingSaved,Campaign:${JAPIT_CAMPAIGN_NAMESPACE},Did:${JAPIT_DID},CustomerNo:${JAPIT_CUSTOMER_NO},Queue:${JAPIT_QUEUE_NAME},AgentExt:${JAPIT_AGENT_EXT},Direction:${IF($["${JAPIT_DIRECTION}"=""]?inbound:${JAPIT_DIRECTION})},Path:${JAPIT_REC_PATH},EventId:${JAPIT_RECORDING_EVENT_ID},LinkedId:${CHANNEL(linkedid)})
same => n(done),Return()

