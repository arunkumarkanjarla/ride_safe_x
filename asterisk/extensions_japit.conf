same => n,Set(JAPIT_AGENT_EXT=${EXTEN})
same => n,Dial(PJSIP/${EXTEN},30,U(japit-bridge-answer^${EXTEN}^1))
same => n,Hangup()

[japit-bridge-answer]
exten => _X.,1,NoOp(Japit deskphone bridge answered for ${EXTEN})
same => n,UserEvent(JapitDeskphoneBridge,AgentExt:${EXTEN},Channel:${CHANNEL(name)},LinkedId:${CHANNEL(linkedid)})
same => n,ConfBridge(${EXTEN},japit_agent_bridge,japit_agent_user)
same => n,Return()

[japit-agent-offer]
exten => _X.,1,NoOp(Japit hybrid agent offer ext ${EXTEN})
 same => n,Set(JAPIT_AGENT_EXT=${EXTEN})
 ; __ prefix so customer number inherits onto the outbound PJSIP/WebRTC INVITE leg.
 same => n,Set(__JAPIT_CUSTOMER_NO=${IF($[${LEN(${JAPIT_CUSTOMER_NO})}>0]?${FILTER(0123456789,${JAPIT_CUSTOMER_NO})}:${FILTER(0123456789,${CALLERID(num)})})})
 same => n,Set(JAPIT_TELEPHONY_MODE=${ODBC_GET_JAPIT_AGENT_TELEPHONY_MODE(${EXTEN})})
 same => n,GotoIf($["${JAPIT_TELEPHONY_MODE}"="webrtc"]?webrtc)
 same => n,Goto(desk_join)
 ; PJSIP_HEADER must run on the outbound PJSIP channel (b() pre-dial), not Local.
exten => _X.,n(webrtc),UserEvent(JapitAgentOffer,AgentExt:${EXTEN},CustomerNo:${JAPIT_CUSTOMER_NO},LinkedId:${CHANNEL(linkedid)},Mode:webrtc)
 ; Put customer mobile in SIP From so the portal popup can show it even if custom headers are stripped.
 same => n,ExecIf($[${LEN(${JAPIT_CUSTOMER_NO})}>0]?Set(CALLERID(num)=${JAPIT_CUSTOMER_NO}))
 same => n,ExecIf($[${LEN(${JAPIT_CUSTOMER_NO})}>0]?Set(CALLERID(name)=${JAPIT_CUSTOMER_NO}))
 same => n,Dial(PJSIP/${EXTEN}ws,45,tTb(japit-webrtc-invite-headers^s^1))
 same => n,Hangup()
; Deskphone (X-Lite): do NOT Answer the queue member leg.
; Answering would bridge the customer to this Local (no agent audio) and AMI DialEnd
; would falsely mark the call connected. Keep Queue ringing; customer stays on queue MOH
; until portal Accept Redirects Mediant into the agent ConfBridge (WebRTC-like Accept UX).
exten => _X.,n(desk_join),UserEvent(JapitAgentOffer,AgentExt:${EXTEN},CustomerNo:${JAPIT_CUSTOMER_NO},LinkedId:${CHANNEL(linkedid)},Mode:deskphone,Queue:${JAPIT_QUEUE_NAME})
 same => n,Gosub(japit-report-meta,s,1(${JAPIT_QUEUE_NAME},${EXTEN},${QUEUE_MEMBER(${JAPIT_QUEUE_NAME},penalty,Local/${EXTEN}@japit-agent-offer/n)},))
 same => n,Progress()
 same => n,Wait(120)
 same => n,Hangup()

; AST-15: emit structured reporting metadata without overwriting overflow/callback CDR userfields.
[japit-report-meta]
exten => s,1,NoOp(Japit report meta queue=${ARG1} agent=${ARG2} penalty=${ARG3} skill=${ARG4})
same => n,Set(JAPIT_REPORT_QUEUE=${ARG1})
same => n,Set(JAPIT_REPORT_AGENT=${ARG2})
same => n,Set(JAPIT_REPORT_PENALTY=${ARG3})
same => n,Set(JAPIT_REPORT_SKILL=${ARG4})
same => n,ExecIf($[${LEN(${JAPIT_REPORT_ROUTE})}=0]?Set(JAPIT_REPORT_ROUTE=${JAPIT_ROUTE_TYPE}))
same => n,CELGenUserEvent(JAPIT_REPORT_META,Extra:queue=${JAPIT_REPORT_QUEUE}\;agent=${JAPIT_REPORT_AGENT}\;penalty=${JAPIT_REPORT_PENALTY}\;skill=${JAPIT_REPORT_SKILL}\;route=${JAPIT_REPORT_ROUTE}\;linkedid=${CHANNEL(linkedid)})
same => n,UserEvent(JapitReportMeta,Queue:${JAPIT_REPORT_QUEUE},AgentExt:${JAPIT_REPORT_AGENT},Penalty:${JAPIT_REPORT_PENALTY},SkillGroup:${JAPIT_REPORT_SKILL},RoutingDecision:${JAPIT_REPORT_ROUTE},LinkedId:${CHANNEL(linkedid)})
same => n,Return()

[japit-webrtc-invite-headers]
exten => s,1,NoOp(Add Japit headers on WebRTC INVITE customer ${JAPIT_CUSTOMER_NO})
 same => n,ExecIf($[${LEN(${JAPIT_CUSTOMER_NO})}=0]?Set(JAPIT_CUSTOMER_NO=${FILTER(0123456789,${CALLERID(num)})}))
 same => n,ExecIf($[${LEN(${JAPIT_CUSTOMER_NO})}>0]?Set(PJSIP_HEADER(add,X-Japit-Customer-No)=${JAPIT_CUSTOMER_NO}))
 same => n,Set(PJSIP_HEADER(add,X-Japit-Direction)=inbound)
 same => n,Return()

