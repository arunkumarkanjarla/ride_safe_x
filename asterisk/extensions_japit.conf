same => n,Hangup(16)

[japit-payment-start]
; Phase 28 AST-27 — pause MixMonitor for PCI-safe payment mode. Return() only.
; Never NoOp/UserEvent digit values. API is authoritative; this is an optional Gosub target.
exten => s,1,NoOp(Japit payment mode start linked=${CHANNEL(linkedid)})
same => n,Set(__JAPIT_PAYMENT_MODE=1)
same => n,TryExec(PauseMixMonitor())
same => n,UserEvent(JapitPaymentMode,State:active,LinkedId:${CHANNEL(linkedid)},Session:${JAPIT_CALL_SESSION_ID},Node:${IF($["${JAPIT_ASTERISK_NODE_ID}"=""]?${JAPIT_NODE_ID}:${JAPIT_ASTERISK_NODE_ID})})
same => n,Return()

[japit-payment-end]
; Resume only when JAPIT_PAYMENT_SAFE=1. Uncertain recovery must keep recording paused.
exten => s,1,NoOp(Japit payment mode end linked=${CHANNEL(linkedid)})
same => n,GotoIf($["${JAPIT_PAYMENT_SAFE}"="0"]?hold)
same => n,Set(__JAPIT_PAYMENT_MODE=0)
same => n,TryExec(UnpauseMixMonitor())
same => n,UserEvent(JapitPaymentMode,State:ended,LinkedId:${CHANNEL(linkedid)},Session:${JAPIT_CALL_SESSION_ID})
same => n,Return()
same => n(hold),NoOp(Japit payment end without resume — recording stays paused)
same => n,UserEvent(JapitPaymentMode,State:unknown,LinkedId:${CHANNEL(linkedid)},Session:${JAPIT_CALL_SESSION_ID})
same => n,Return()

