same => n,UserEvent(JapitOriginationRequested,AgentExt:${JAPIT_AGENT_EXT},CustomerNo:${JAPIT_CUSTOMER_NO},DialedNumber:${NUM},Did:${JAPIT_DID},Queue:${JAPIT_QUEUE_NAME},Campaign:${JAPIT_CAMPAIGN_NAMESPACE},EventId:${JAPIT_ORIG_EVENT_ID},LinkedId:${CHANNEL(linkedid)})
same => n,Goto(japit-deskphone-pstn-joined,s,1)

exten => missing-agent,1,NoOp(Deskphone outbound missing agent)
same => n,Hangup(21)

; DEPRECATED: Dial U()+ConfBridge breaks Hold Redirect (async goto / abnormal Gosub).
; Kept only so old Local originates fail safe into hangup-aux.
[japit-deskphone-outbound]
exten => _X.,1,NoOp(DEPRECATED deskphone-outbound — use direct Mediant originate)
same => n,Set(JAPIT_CHAN_NAME=${CHANNEL(name)})
same => n,Set(JAPIT_CHAN_SAFE=${REPLACE(JAPIT_CHAN_NAME,\;)})
same => n,GotoIf($["${JAPIT_CHAN_SAFE:-1}"="1"]?hangup-aux)
same => n,GotoIf($["${JAPIT_AGENT_EXT}"=""]?missing-agent,1)
same => n,Set(NUM=${FILTER(0123456789,${EXTEN})})
same => n,ExecIf($["${NUM:0:1}"!="0"]?Set(NUM=0${NUM}))
same => n,Gosub(japit-pstn-dial,s,1(${NUM},60,R))
same => n,Hangup()

exten => _X.,n(hangup-aux),NoOp(Deskphone outbound Local aux hangup)
same => n,Hangup()

exten => missing-agent,1,NoOp(Deskphone outbound missing agent)
same => n,Hangup(21)

; Mediant answered — ConfBridge is PRIMARY app (Redirect hold/unhold safe).
[japit-deskphone-pstn-joined]
exten => s,1,NoOp(Deskphone PSTN answered — join agent conf ${JAPIT_AGENT_EXT})
same => n,Set(JAPIT_CUSTOMER_NO=${FILTER(0123456789,${JAPIT_CUSTOMER_NO})})
same => n,ExecIf($[${LEN(${JAPIT_CUSTOMER_NO})}=0]?Set(JAPIT_CUSTOMER_NO=${FILTER(0123456789,${CALLERID(num)})}))
same => n,ExecIf($["${JAPIT_QUEUE_NAME}"=""]?Set(JAPIT_QUEUE_NAME=${ODBC_GET_JAPIT_AGENT_QUEUE(${JAPIT_AGENT_EXT})}))
same => n,ExecIf($["${JAPIT_CAMPAIGN_NAMESPACE}"=""]?Set(JAPIT_CAMPAIGN_NAMESPACE=${ODBC_GET_JAPIT_AGENT_CAMPAIGN_NAMESPACE(${JAPIT_AGENT_EXT})}))
same => n,ExecIf($[${LEN(${JAPIT_DID})}<8]?Set(JAPIT_DID=${ODBC_GET_JAPIT_OUTBOUND_DID(${JAPIT_AGENT_EXT})}))
same => n,ExecIf($[${LEN(${JAPIT_DID})}<8]?Set(JAPIT_DID=${ODBC_GET_JAPIT_AGENT_CAMPAIGN_DID(${JAPIT_AGENT_EXT})}))
same => n,Set(__JAPIT_DIRECTION=outbound)
same => n,Set(CHANNEL(hangup_handler_push)=japit-recording-hangup,s,1)
same => n,Set(CHANNEL(hangup_handler_push)=japit-rtp-qos-hangup,s,1)
same => n,Set(JAPIT_ORIG_EVENT_ID=${ODBC_LOG_JAPIT_ORIGINATION_EVENT(${CHANNEL(linkedid)},${JAPIT_AGENT_EXT},${JAPIT_CUSTOMER_NO},${CALLERID(num)},${JAPIT_DID},${JAPIT_QUEUE_NAME},${JAPIT_CAMPAIGN_NAMESPACE},ami,answered)})
same => n,UserEvent(JapitOriginationAnswered,AgentExt:${JAPIT_AGENT_EXT},CustomerNo:${JAPIT_CUSTOMER_NO},CustomerChannel:${CHANNEL(name)},Did:${JAPIT_DID},Queue:${JAPIT_QUEUE_NAME},Campaign:${JAPIT_CAMPAIGN_NAMESPACE},EventId:${JAPIT_ORIG_EVENT_ID},LinkedId:${CHANNEL(linkedid)})
; AMI kicks Playtones feeder; tiny grace avoids overlap but joins customer promptly.
same => n,Wait(0.1)
same => n,Set(JAPIT_REC_STEM=${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-japit-out-${CHANNEL(linkedid)})
same => n,MixMonitor(/var/spool/asterisk/monitor/${JAPIT_REC_STEM}.wav,b)
same => n,ConfBridge(${JAPIT_AGENT_EXT},japit_agent_bridge,japit_agent_user)
same => n,Hangup()

; Legacy Dial-U gosub target — redirect into hold-safe joined context.
[japit-deskphone-pstn-to-conf]
exten => s,1,NoOp(Legacy Dial-U pstn-to-conf → hold-safe joined)
same => n,Set(JAPIT_AGENT_EXT=${ARG1})
same => n,Goto(japit-deskphone-pstn-joined,s,1)

; Kick non-admin feeders only (requires japit_agent_user admin=yes).
[japit-deskphone-kick-ringback]
exten => s,1,NoOp(Kick deskphone ringback feeders from conf ${ARG1})
same => n,ConfKick(${ARG1},participants)
same => n,Return()

[japit-outbound-local-idle]
exten => s,1,NoOp(Deskphone outbound Local idle leg)
same => n,Wait(125)
same => n,Hangup()

; Local/;2 joins ConfBridge; paired leg runs clean single-tone ring (not MOH music).
[japit-ringback-join]
exten => _X.,1,NoOp(Deskphone outbound ringback feeder for ${EXTEN})
same => n,Answer()
same => n,ConfBridge(${EXTEN},japit_agent_bridge,japit_ringback_user)
same => n,Hangup()

