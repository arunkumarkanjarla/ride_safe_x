; AST-17 hardened AMI users for Japit.
; Inject the real secret via deployment overlay / EnvironmentFile.
; See manager_japit.conf.sample for dual-node and readonly patterns.

[general]
timestampevents = yes
; Production: set bindaddr to the private management IP (not 0.0.0.0).
; bindaddr = 127.0.0.1

[japitami]
secret = JapitAMI!a6dajpb8gmuGbquKy_JmWWSn
deny = 0.0.0.0/0.0.0.0
; Localhost
permit = 127.0.0.1/255.255.255.255

; SonicWALL office VPN pool (laptop IP changes with DHCP, currently 192.168.100.169)
permit = 192.168.100.0/255.255.255.0

; Home / personal Wi-Fi (Jio etc.) when used with VPN split-tunnel edge cases
permit = 10.218.28.0/255.255.255.0

; Office subnet
permit = 10.10.10.0/255.255.254.0
; PBX LAN (Asterisk 192.168.20.26, Mediant, FastAPI/Docker host)
permit = 192.168.20.0/255.255.255.0
; Docker / private bridges (FastAPI replicas talking to AMI)
permit = 172.16.0.0/255.240.0.0
; `config` is required so Admin UI queue strategy/timeout can UpdateConfig queues.conf.
read = system,call,log,verbose,agent,user,reporting,cdr,dialplan,originate,command,security,config
write = system,call,agent,user,reporting,originate,command,config
writetimeout = 5000
; AST-12: filters aligned with ami_telephony_listener.py + ami_telemetry.py consumers.
eventfilter(action(include),name(UserEvent)) =
eventfilter(action(include),name(Newchannel)) =
eventfilter(action(include),name(Newstate)) =
eventfilter(action(include),name(Hangup)) =
eventfilter(action(include),name(BridgeEnter)) =
eventfilter(action(include),name(BridgeLeave)) =
eventfilter(action(include),name(DialBegin)) =
eventfilter(action(include),name(DialEnd)) =
eventfilter(action(include),name(QueueCallerJoin)) =
eventfilter(action(include),name(QueueCallerLeave)) =
eventfilter(action(include),name(QueueCallerAbandon)) =
eventfilter(action(include),name(QueueCallerPosition)) =
eventfilter(action(include),name(QueueMemberStatus)) =
eventfilter(action(include),name(QueueMemberPause)) =
eventfilter(action(include),name(QueueMemberPenalty)) =
eventfilter(action(include),name(QueueMemberAdded)) =
eventfilter(action(include),name(QueueMemberRemoved)) =
eventfilter(action(include),name(QueueMemberRing)) =
eventfilter(action(include),name(AgentCalled)) =
eventfilter(action(include),name(AgentConnect)) =
eventfilter(action(include),name(AgentComplete)) =
eventfilter(action(include),name(AgentRingNoAnswer)) =
eventfilter(action(include),name(VarSet)) =
eventfilter(action(include),name(MixMonitorStart)) =
eventfilter(action(include),name(MixMonitorStop)) =
eventfilter(action(include),name(ConfbridgeLeave)) =
eventfilter(action(include),name(ConfbridgeEnd)) =
eventfilter(action(include),name(FullyBooted)) =
eventfilter(action(include),name(RTCPSent)) =
eventfilter(action(include),name(RTCPReceived)) =

[japitami-readonly]
secret = CHANGE-ME-SET-ASTERISK-AMI-READONLY-SECRET
deny = 0.0.0.0/0.0.0.0
permit = 127.0.0.1/255.255.255.255
; permit = <MONITORING_SUBNET>/<NETMASK>
read = system,call,log,verbose,agent,user,reporting,cdr,dialplan
write =
writetimeout = 5000
