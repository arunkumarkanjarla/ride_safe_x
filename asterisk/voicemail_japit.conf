; Japit AST-24 native mailboxes. AUTO-GENERATED at runtime — do not put user PINs here.
; Ops: add the following to the Japit-managed voicemail.conf (never edit VICIDIAL auto-generated files):
;   #include voicemail_japit.conf
;
; User PINs are stored hashed in PostgreSQL only. Asterisk passwords in this file are
; system secrets written by the API, not agent PINs.

[general]
format=wav
attach=no
maxmsg=100
maxsecs=180
skipms=3000
maxsilence=10
silencethreshold=128
maxlogins=3

[japit]
; mailboxes are appended by python-service app.modules.voicemail.confgen
