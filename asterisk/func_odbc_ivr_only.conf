; Minimal func_odbc.conf for PBX 192.168.20.26 — PostgreSQL DSN "asterisk" only.
; Use if full func_odbc.conf fails to load (mysql1 examples break initialization).
;
;   cp func_odbc_ivr_only.conf /etc/asterisk/func_odbc.conf
;   asterisk -rx "module load res_odbc.so"
;   asterisk -rx "module load func_odbc.so"
;
; Requires res_odbc.conf [asterisk] section and /etc/odbc.ini DSN asterisk-postgres.

[GET_DID_IVR_ID]
dsn=asterisk
readsql=SELECT resolve_did_ivr_id('${SQL_ESC(${ARG1})}')::varchar

[GET_DID_CONDITION_IVR]
dsn=asterisk
readsql=SELECT get_did_ivr_id_for_condition('${SQL_ESC(${ARG1})}', '${SQL_ESC(${ARG2})}')::varchar

[GET_DID_CAMPAIGN_FOLDER]
dsn=asterisk
readsql=SELECT get_did_campaign_folder('${SQL_ESC(${ARG1})}')

[GET_IVR_NAME]
dsn=asterisk
readsql=SELECT get_ivr_name_folder(${ARG1}::integer)

[GET_IVR_CATEGORY]
dsn=asterisk
readsql=SELECT get_ivr_category_folder(${ARG1}::integer)

[GET_IVR_ID_BY_DID]
dsn=asterisk
readsql=SELECT ivr_id::varchar FROM dids WHERE did='${SQL_ESC(${ARG1})}' AND is_active=true LIMIT 1

[GET_IVR_WELCOME]
dsn=asterisk
readsql=SELECT welcome_prompt FROM ivrs WHERE id='${ARG1}'

[GET_IVR_INVALID]
dsn=asterisk
readsql=SELECT invalid_prompt FROM ivrs WHERE id='${ARG1}'

[GET_IVR_TIMEOUT_PROMPT]
dsn=asterisk
readsql=SELECT timeout_prompt FROM ivrs WHERE id='${ARG1}'

[GET_IVR_TIMEOUT]
dsn=asterisk
readsql=SELECT timeout_seconds FROM ivrs WHERE id='${ARG1}'

[GET_IVR_ACTION_TYPE]
dsn=asterisk
readsql=SELECT action_type FROM ivr_options WHERE ivr_id='${ARG1}' AND digit='${ARG2}'

[GET_IVR_ACTION_VALUE]
dsn=asterisk
readsql=SELECT action_value FROM ivr_options WHERE ivr_id='${ARG1}' AND digit='${ARG2}'

[ADD_CALLBACK]
dsn=asterisk
writesql=INSERT INTO callback_requests (customer_number,did_number,queue_name) VALUES ('${VAL1}','${VAL2}','${VAL3}')

[GET_AGENT_DEVICE]
dsn=asterisk
readsql=SELECT device_type FROM agent_active_device WHERE extension='${SQL_ESC(${ARG1})}' LIMIT 1
