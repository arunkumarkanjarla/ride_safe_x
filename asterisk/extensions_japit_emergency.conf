; AST-14 — Emergency number routing policy
; Included from extensions_japit.conf. Numbers are NOT hard-coded here as the
; sole policy source: Asterisk ASTDB keys japit/emergency/<number>=1 are the
; runtime match set, synced from EMERGENCY_NUMBERS / EMERGENCY_STAGING_NUMBERS.
;
; Fallback: GLOBAL(JAPIT_EMERGENCY_REGEX) may be set from globals for boot-time
; use before ASTDB sync. Prefer ASTDB in production.
;
; This route BYPASSES: queue restrictions, DND, campaign dial restrictions,
; predictive dialer rules, and normal outbound policy.
; This route STILL ENFORCES: authenticated SIP endpoint, caller identity for
; audit, trunk availability, and security ACLs.
;
; LIVE PSTN emergency dialing must only be validated in a controlled staging
; window with carrier approval. Use EMERGENCY_STAGING_NUMBERS for safe tests.

[globals](+)
; Comma-separated defaults for documentation / bootstrap only.
; Production FastAPI syncs ASTDB from EMERGENCY_NUMBERS env.
JAPIT_EMERGENCY_ENABLED=yes
JAPIT_EMERGENCY_TRUNK=
JAPIT_EMERGENCY_CLI=
JAPIT_EMERGENCY_CLI_FALLBACK=
JAPIT_EMERGENCY_NODE=asterisk-1

[japit-emergency-detect]
; ARG1 = dialed digits (already filtered). Returns via JAPIT_IS_EMERGENCY=1|0
exten => s,1,NoOp(Japit emergency detect ${ARG1})
same => n,Set(JAPIT_EMERGENCY_CANDIDATE=${FILTER(0123456789,${ARG1})})
same => n,GotoIf($[${LEN(${JAPIT_EMERGENCY_CANDIDATE})}=0]?no)
same => n,GotoIf($["${GLOBAL(JAPIT_EMERGENCY_ENABLED)}"!="yes"]?no)
same => n,Set(JAPIT_IS_EMERGENCY=${DB(japit/emergency/${JAPIT_EMERGENCY_CANDIDATE})})
same => n,GotoIf($["${JAPIT_IS_EMERGENCY}"="1"]?yes)
; Optional bootstrap regex from GLOBAL (set by ops overlay, not multi-file hardcode).
same => n,GotoIf($[${LEN(${GLOBAL(JAPIT_EMERGENCY_REGEX)})}=0]?no)
same => n,GotoIf($[${REGEX("${GLOBAL(JAPIT_EMERGENCY_REGEX)}" ${JAPIT_EMERGENCY_CANDIDATE})}]?yes:no)
same => n(yes),Set(JAPIT_IS_EMERGENCY=1)
same => n,Return()
same => n(no),Set(JAPIT_IS_EMERGENCY=0)
same => n,Return()

[japit-emergency]
; Dedicated emergency route used by WebRTC, deskphone, and either Asterisk node.
exten => _X.,1,NoOp(Japit EMERGENCY route ${EXTEN} from ${CHANNEL(endpoint)} node=${GLOBAL(JAPIT_EMERGENCY_NODE)})
same => n,Set(JAPIT_EMERGENCY_NUMBER=${FILTER(0123456789,${EXTEN})})
same => n,Set(JAPIT_AGENT_RAW=${IF($[${LEN(${JAPIT_AGENT_EXT})}>0]?${JAPIT_AGENT_EXT}:${CHANNEL(endpoint)})})
same => n,ExecIf($["${JAPIT_AGENT_RAW:-2}"="ws"]?Set(JAPIT_AGENT_EXT=${JAPIT_AGENT_RAW:0:$[${LEN(${JAPIT_AGENT_RAW})}-2]}):Set(JAPIT_AGENT_EXT=${JAPIT_AGENT_RAW}))
same => n,Set(JAPIT_EMERGENCY_ENDPOINT=${CHANNEL(endpoint)})
same => n,Set(JAPIT_EMERGENCY_NODE=${IF($[${LEN(${GLOBAL(JAPIT_EMERGENCY_NODE)})}>0]?${GLOBAL(JAPIT_EMERGENCY_NODE)}:asterisk-1)})
; Trunk: explicit emergency trunk, else primary Mediant (AST-06 failover still applies).
same => n,Set(JAPIT_TRUNK_PRIMARY=${IF($[${LEN(${GLOBAL(JAPIT_EMERGENCY_TRUNK)})}>0]?${GLOBAL(JAPIT_EMERGENCY_TRUNK)}:${IF($[${LEN(${JAPIT_TRUNK_PRIMARY})}=0]?Mediant:${JAPIT_TRUNK_PRIMARY})})})
; CLI: configured emergency CLI → fallback → existing outbound DID infrastructure (never invent).
same => n,Set(JAPIT_EMERGENCY_CLI=${GLOBAL(JAPIT_EMERGENCY_CLI)})
same => n,ExecIf($[${LEN(${JAPIT_EMERGENCY_CLI})}<3]?Set(JAPIT_EMERGENCY_CLI=${GLOBAL(JAPIT_EMERGENCY_CLI_FALLBACK)}))
same => n,ExecIf($[${LEN(${JAPIT_EMERGENCY_CLI})}<8]?Set(JAPIT_EMERGENCY_CLI=${ODBC_GET_JAPIT_OUTBOUND_DID(${JAPIT_AGENT_EXT})}))
same => n,ExecIf($[${LEN(${JAPIT_EMERGENCY_CLI})}<8]?Set(JAPIT_EMERGENCY_CLI=${ODBC_GET_JAPIT_AGENT_CAMPAIGN_DID(${JAPIT_AGENT_EXT})}))
same => n,GotoIf($[${LEN(${JAPIT_EMERGENCY_CLI})}<3]?missing-cli)
same => n,Set(CALLERID(num)=${JAPIT_EMERGENCY_CLI})
same => n,Set(__JAPIT_DIRECTION=emergency)
same => n,Set(__JAPIT_DID=${JAPIT_EMERGENCY_CLI})
same => n,Set(__JAPIT_CUSTOMER_NO=${JAPIT_EMERGENCY_NUMBER})
same => n,Set(CDR(userfield)=emergency:${JAPIT_EMERGENCY_NUMBER}:cli=${JAPIT_EMERGENCY_CLI}:trunk=${JAPIT_TRUNK_PRIMARY}:node=${JAPIT_EMERGENCY_NODE})
same => n,CELGenUserEvent(JAPIT_EMERGENCY,Extra:number=${JAPIT_EMERGENCY_NUMBER}\;cli=${JAPIT_EMERGENCY_CLI}\;trunk=${JAPIT_TRUNK_PRIMARY}\;agent=${JAPIT_AGENT_EXT}\;endpoint=${JAPIT_EMERGENCY_ENDPOINT}\;node=${JAPIT_EMERGENCY_NODE})
same => n,UserEvent(JapitEmergencyDial,AgentExt:${JAPIT_AGENT_EXT},Endpoint:${JAPIT_EMERGENCY_ENDPOINT},EmergencyNumber:${JAPIT_EMERGENCY_NUMBER},Trunk:${JAPIT_TRUNK_PRIMARY},CLI:${JAPIT_EMERGENCY_CLI},Node:${JAPIT_EMERGENCY_NODE},LinkedId:${CHANNEL(linkedid)})
same => n,Set(JAPIT_ORIG_EVENT_ID=${ODBC_LOG_JAPIT_ORIGINATION_EVENT(${CHANNEL(linkedid)},${JAPIT_AGENT_EXT},${JAPIT_EMERGENCY_NUMBER},${JAPIT_EMERGENCY_NUMBER},${JAPIT_EMERGENCY_CLI},emergency,emergency,emergency,requested)})
same => n,NoOp(Japit emergency audit event_id=${JAPIT_ORIG_EVENT_ID})
; Staging numbers: answer + playback + hangup — NEVER dial PSTN for staging markers.
same => n,GotoIf($["${DB(japit/emergency-staging/${JAPIT_EMERGENCY_NUMBER})}"="1"]?staging)
same => n,Gosub(japit-pstn-dial,s,1(${JAPIT_EMERGENCY_NUMBER},60,tT))
same => n,UserEvent(JapitEmergencyResult,AgentExt:${JAPIT_AGENT_EXT},EmergencyNumber:${JAPIT_EMERGENCY_NUMBER},Trunk:${JAPIT_TRUNK_USED},CLI:${JAPIT_EMERGENCY_CLI},Node:${JAPIT_EMERGENCY_NODE},DialStatus:${DIALSTATUS},LinkedId:${CHANNEL(linkedid)})
same => n,Hangup()
same => n(staging),NoOp(Japit emergency STAGING path — no PSTN dial for ${JAPIT_EMERGENCY_NUMBER})
same => n,Answer()
same => n,Playback(beep)
same => n,UserEvent(JapitEmergencyResult,AgentExt:${JAPIT_AGENT_EXT},EmergencyNumber:${JAPIT_EMERGENCY_NUMBER},Trunk:staging,CLI:${JAPIT_EMERGENCY_CLI},Node:${JAPIT_EMERGENCY_NODE},DialStatus:STAGING,LinkedId:${CHANNEL(linkedid)})
same => n,Hangup()
same => n(missing-cli),NoOp(Japit emergency blocked — no configured CLI/DID available)
same => n,UserEvent(JapitEmergencyResult,AgentExt:${JAPIT_AGENT_EXT},EmergencyNumber:${JAPIT_EMERGENCY_NUMBER},Trunk:${JAPIT_TRUNK_PRIMARY},CLI:,Node:${JAPIT_EMERGENCY_NODE},DialStatus:NOCLI,LinkedId:${CHANNEL(linkedid)})
same => n,Playback(ss-noservice)
same => n,Hangup(21)
