; AST-15 — Anti-toll-fraud dialplan guards
; Included from extensions_japit.conf. Evaluates FastAPI policy before PSTN dial.
; Emergency numbers (AST-14) bypass via the FastAPI policy (emergency_bypass=true).

[japit-tollfraud-check]
; ARG1 = dialed digits (normalized), ARG2 = extension
exten => s,1,NoOp(Japit tollfraud check dest=${ARG1} ext=${ARG2})
same => n,Set(JAPIT_TF_DEST=${FILTER(0123456789,${ARG1})})
same => n,GotoIf($[${LEN(${JAPIT_TF_DEST})}=0]?allow)
same => n,Set(JAPIT_ENGINE_URL=${ODBC_GET_JAPIT_ROUTING_ENGINE_BASE_URL()})
same => n,GotoIf($[${LEN(${JAPIT_ENGINE_URL})}=0]?allow)
same => n,Set(CURLOPT(httptimeout)=1)
same => n,Set(JAPIT_TF_RAW=${CURL(${JAPIT_ENGINE_URL}/api/v1/system/tollfraud/telephony/evaluate?number=${JAPIT_TF_DEST}&extension=${ARG2}&concurrent=0)})
same => n,NoOp(Japit tollfraud raw=${JAPIT_TF_RAW})
same => n,GotoIf($["${JAPIT_TF_RAW}"=""]?allow)
same => n,Set(JAPIT_TF_STATUS=${CUT(JAPIT_TF_RAW,|,1)})
same => n,Set(JAPIT_TF_ALLOWED=${CUT(JAPIT_TF_RAW,|,2)})
same => n,Set(JAPIT_TF_RULE=${CUT(JAPIT_TF_RAW,|,3)})
same => n,Set(JAPIT_TF_MAXDUR=${CUT(JAPIT_TF_RAW,|,4)})
same => n,GotoIf($["${JAPIT_TF_ALLOWED}"="1"]?allow)
same => n,NoOp(Japit tollfraud BLOCK rule=${JAPIT_TF_RULE})
same => n,Set(CDR(userfield)=tollfraud_block:${JAPIT_TF_RULE}:${JAPIT_TF_DEST})
same => n,CELGenUserEvent(JAPIT_TOLLFRAUD_BLOCK,Extra:rule=${JAPIT_TF_RULE}\;dest=${JAPIT_TF_DEST}\;ext=${ARG2}\;node=${GLOBAL(JAPIT_NODE_ID)})
same => n,UserEvent(JapitTollfraudBlock,Rule:${JAPIT_TF_RULE},Destination:${JAPIT_TF_DEST},Extension:${ARG2},Node:${GLOBAL(JAPIT_NODE_ID)},LinkedId:${CHANNEL(linkedid)})
same => n,Playback(ss-noservice)
same => n,Hangup(21)
same => n(allow),NoOp(Japit tollfraud allow rule=${JAPIT_TF_RULE})
same => n,ExecIf($[${LEN(${JAPIT_TF_MAXDUR})}>0 & ${JAPIT_TF_MAXDUR}>0]?Set(TIMEOUT(absolute)=${JAPIT_TF_MAXDUR}))
same => n,Return()
