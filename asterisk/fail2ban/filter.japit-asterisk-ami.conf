# Fail2ban filter — Asterisk AMI auth failures (AST-17)
# /etc/fail2ban/filter.d/japit-asterisk-ami.conf

[Definition]
failregex = NOTICE.* .*: .*failed to authenticate as '.*' \(.*?<HOST>.*\)
            NOTICE.* .*: Incorrect password attempt from['" ]*<HOST>
            SECURITY.* .*: SecurityEvent="FailedACL".*RemoteAddress=".+/<HOST>/.+"
            SECURITY.* .*: SecurityEvent="InvalidAccountID".*Service="AMI".*RemoteAddress=".+/<HOST>/.+"
ignoreregex =
