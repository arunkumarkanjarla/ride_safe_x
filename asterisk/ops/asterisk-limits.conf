# AST-30 systemd drop-in for the Asterisk process on Linux PBX hosts.
# Install:
#   mkdir -p /etc/systemd/system/asterisk.service.d
#   cp asterisk-limits.conf /etc/systemd/system/asterisk.service.d/ast30-capacity.conf
#   systemctl daemon-reload && systemctl restart asterisk
#
# Previous typical: LimitNOFILE unset or 1024.
# New: 16384 (calculated MixMonitor+RTP+SIP for 400 calls with headroom).
# Rollback: remove this drop-in, daemon-reload, restart asterisk.
#
# Do not apply on Windows. Do not change FastAPI Docker ulimits (image already 1048576).

[Service]
LimitNOFILE=16384
LimitNPROC=65535
