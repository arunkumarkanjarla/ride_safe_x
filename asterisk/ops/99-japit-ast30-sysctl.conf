; AST-30 — optional sysctl for Linux Asterisk PBX hosts only.
; Do NOT apply on Windows / Docker Desktop workstations.
;
; Measure CURRENT values first:
;   sysctl net.core.rmem_max net.core.wmem_max net.core.netdev_max_backlog fs.file-max
; Copy those values into the rollback column of PHASE31_IMPLEMENTATION_REPORT.md
; then apply:
;   cp 99-japit-ast30-sysctl.conf /etc/sysctl.d/
;   sysctl --system
;
; Rollback: restore previous numbers and sysctl --system.

net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.core.netdev_max_backlog = 5000
