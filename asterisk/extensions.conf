; =========================================================
; INTERNAL WEBRTC CALLS
; =========================================================
[internal]

exten => 999,1,NoOp(Echo Test)
same => n,Answer()
same => n,Echo()
same => n,Hangup()

exten => _7XXX,1,NoOp(Internal Call ${EXTEN})
same => n,Dial(PJSIP/${EXTEN},30)
same => n,Hangup()

exten => _X.,1,NoOp(Outbound Call ${EXTEN})
same => n,Goto(outbound,${EXTEN},1)

; =========================================================
; OUTBOUND ROUTING
; =========================================================
[outbound]

exten => _X.,1,NoOp(Processing Outbound Number)
same => n,Set(NUM=${EXTEN})
same => n,ExecIf($["${NUM:0:1}"="+"]?Set(NUM=${NUM:1}))
same => n,ExecIf($["${NUM:0:2}"="91"]?Set(NUM=${NUM:2}))
same => n,ExecIf($["${NUM:0:1}"!="0"]?Set(NUM=0${NUM}))
same => n,NoOp(Final Number: ${NUM})
same => n,Set(EHP_AGENT_RAW=${IF($[${LEN(${EHP_AGENT_EXT})}>0]?${EHP_AGENT_EXT}:${CHANNEL(endpoint)})})
same => n,ExecIf($["${EHP_AGENT_RAW:-2}"="ws"]?Set(EHP_AGENT_EXT=${EHP_AGENT_RAW:0:$[${LEN(${EHP_AGENT_RAW})}-2]}):Set(EHP_AGENT_EXT=${EHP_AGENT_RAW}))
same => n,ExecIf($["${EHP_CAMPAIGN}"=""]?Set(EHP_CAMPAIGN=${ODBC_GET_AGENT_CAMPAIGN_FOLDER(${EHP_AGENT_EXT})}))
same => n,ExecIf($["${EHP_QUEUE}"=""]?Set(EHP_QUEUE=${ODBC_GET_AGENT_QUEUE(${EHP_AGENT_EXT})}))
same => n,ExecIf($[${LEN(${ORIGINAL_DID})}=0]?Set(ORIGINAL_DID=${ODBC_GET_AGENT_CAMPAIGN_DID(${EHP_AGENT_EXT})}))
same => n,Set(__CUSTOMER_NO=${NUM})
same => n,Set(__EHP_DIRECTION=outbound)
same => n,Set(CHANNEL(hangup_handler_push)=ehp-recording-hangup,s,1)
same => n,Set(EHP_REC_STEM=${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-out-${CHANNEL(linkedid)})
same => n,MixMonitor(/var/spool/asterisk/monitor/${EHP_REC_STEM}.wav,b)
same => n,Set(CALLERID(num)=0700000000)
same => n,Dial(PJSIP/${NUM}@Mediant,60)
same => n,Hangup()

; =========================================================
; INCOMING CALLS FROM MEDIANT
; =========================================================
[direct-inbound]

exten => _+X.,1,NoOp(Incoming DID With Plus ${EXTEN})
same => n,Set(NUM=${EXTEN:1})
same => n,Goto(japit-pre-router,${NUM},1)

exten => _X.,1,NoOp(Incoming DID ${EXTEN})
same => n,Goto(japit-pre-router,${EXTEN},1)

; =========================================================
; MAIN DYNAMIC DID ROUTING
; =========================================================
[inbound]

exten => _X.,1,NoOp(Main Dynamic DID Routing — did_ivr_rules + legacy fallback)

same => n,Set(__ORIGINAL_DID=${EXTEN})
same => n,Set(__CUSTOMER_NO=${CALLERID(num)})
same => n,Set(ORIGINAL_DID=${EXTEN})
same => n,Set(CUSTOMER_NO=${CALLERID(num)})
same => n,Set(__EHP_CAMPAIGN=${ODBC_GET_DID_CAMPAIGN_FOLDER(${EXTEN})})
same => n,Set(EHP_CAMPAIGN=${__EHP_CAMPAIGN})
same => n,Set(__EHP_DIRECTION=inbound)
same => n,Set(CHANNEL(hangup_handler_push)=ehp-recording-hangup,s,1)

; resolve_did_ivr_id() in PostgreSQL evaluates rules: holiday → no agents → busy → callback → voicemail → default
same => n,Set(IVR_ID=${ODBC_GET_DID_IVR_ID(${EXTEN})})
same => n,GotoIf($["${IVR_ID}"!=""]?route_ivr)

; legacy fallback if function/rules missing
same => n,Set(IVR_ID=${ODBC_GET_IVR_ID_BY_DID(${EXTEN})})

same => n(route_ivr),NoOp(DID: ${EXTEN} IVR_ID: ${IVR_ID})
same => n,GotoIf($["${IVR_ID}"=""]?hangup)
same => n,Goto(dynamic-ivr,s,1)

same => n(hangup),NoOp(No IVR for DID ${EXTEN})
same => n,Hangup()

; =========================================================
; QUEUE ROUTING
; =========================================================
[queue-routing]

exten => s,1,NoOp(Queue Routing)
same => n,Set(QUEUE_NAME=${ROUTE_VALUE})
same => n,Answer()
same => n,Queue(${QUEUE_NAME},t,,,20)
same => n,NoOp(Queue Status: ${QUEUESTATUS})
same => n,GotoIf($["${QUEUESTATUS}"="TIMEOUT"]?dynamic-ivr,s,1)
same => n,GotoIf($["${QUEUESTATUS}"="JOINEMPTY"]?dynamic-ivr,s,1)
same => n,GotoIf($["${QUEUESTATUS}"="FULL"]?dynamic-ivr,s,1)
same => n,GotoIf($["${QUEUESTATUS}"="LEAVEEMPTY"]?dynamic-ivr,s,1)
same => n,Hangup()

; =========================================================
; IVR ROUTING
; =========================================================
[ivr-routing]

exten => s,1,NoOp(IVR Routing)
same => n,Set(IVR_ID=${ROUTE_VALUE})
same => n,Goto(dynamic-ivr,s,1)

; =========================================================
; EXTENSION ROUTING
; =========================================================
[extension-routing]

exten => s,1,NoOp(Extension Routing)
same => n,Dial(PJSIP/${ROUTE_VALUE},30)
same => n,Hangup()

; =========================================================
; VOICEMAIL ROUTING
; =========================================================
[voicemail-routing]

exten => s,1,NoOp(Voicemail Routing)
same => n,Set(VM_SOURCE=direct_route)
same => n,Set(VM_MAILBOX=${ROUTE_VALUE})
same => n,Goto(ehp-voicemail-record,s,1)

; =========================================================
; DYNAMIC IVR
; =========================================================
[dynamic-ivr]

exten => s,1,NoOp(Dynamic IVR)

same => n,ExecIf($["${CHANNEL(state)}"!="Up"]?Answer())

same => n,Wait(1)

same => n,NoOp(Using IVR ${IVR_ID})

same => n,Set(WELCOME=${ODBC_GET_IVR_WELCOME(${IVR_ID})})

same => n,Set(INVALID=${ODBC_GET_IVR_INVALID(${IVR_ID})})

same => n,Set(TIMEOUT_PROMPT=${ODBC_GET_IVR_TIMEOUT_PROMPT(${IVR_ID})})

same => n,Set(TIMEOUT=${ODBC_GET_IVR_TIMEOUT(${IVR_ID})})

same => n,NoOp(WELCOME FILE = ${WELCOME})

same => n,Playback(${WELCOME})

same => n,WaitExten(${TIMEOUT})



; ---- Sub-extension: jump here if welcome is empty ----
exten => play-menu,1,NoOp(Playing Menu)
same => n,Background(custom/callback_option)
same => n,WaitExten(${TIMEOUT})
same => n,Hangup()

; ---- Invalid input ----
exten => i,1,NoOp(Invalid Input)
same => n,GotoIf($["${INVALID}"=""]?dynamic-ivr,s,1)
same => n,Playback(${INVALID})
same => n,Goto(dynamic-ivr,s,1)

; ---- Timeout ----
exten => t,1,NoOp(Timeout)
same => n,GotoIf($["${TIMEOUT_PROMPT}"=""]?default-timeout,1)
same => n,Playback(${TIMEOUT_PROMPT})

exten => default-timeout,1,Hangup()

; =========================================================
; *** DIGIT HANDLER — INSIDE [dynamic-ivr], NOT a new context ***
; =========================================================

exten => _X,1,NoOp(Digit ${EXTEN} pressed for IVR ${IVR_ID})
same => n,Set(ACTION_TYPE=${ODBC_GET_IVR_ACTION_TYPE(${IVR_ID},${EXTEN})})
same => n,Set(ACTION_VALUE=${ODBC_GET_IVR_ACTION_VALUE(${IVR_ID},${EXTEN})})
same => n,NoOp(Action: ${ACTION_TYPE} => ${ACTION_VALUE})
same => n,GotoIf($["${ACTION_TYPE}"=""]?i,1)
same => n,GotoIf($["${ACTION_TYPE}"="queue"]?ivr-opt-queue,s,1)
same => n,ExecIf($["${ACTION_TYPE}"="voicemail"]?Set(VM_DIGIT=${EXTEN}))
same => n,ExecIf($["${ACTION_TYPE}"="voicemail"]?Set(VM_IVR_ID=${IVR_ID}))
same => n,GotoIf($["${ACTION_TYPE}"="voicemail"]?ivr-opt-voicemail,s,1)
same => n,GotoIf($["${ACTION_TYPE}"="callback"]?ivr-opt-callback,s,1)
same => n,GotoIf($["${ACTION_TYPE}"="nested_ivr"]?ivr-opt-nested,s,1)
same => n,Goto(i,1)

; =========================================================
; IVR ACTION — QUEUE
; =========================================================
[ivr-opt-queue]
exten => s,1,NoOp(IVR Queue entry)
 same => n,Set(QUEUE_NAME=${IF($[${LEN(${QUEUE_NAME})}>0]?${QUEUE_NAME}:${ACTION_VALUE})})
 same => n,NoOp(IVR Queue: ${QUEUE_NAME})
 same => n,GotoIf($[${LEN(${QUEUE_NAME})}=0]?badqueue)
 same => n,Set(__CUSTOMER_NO=${IF($[${LEN(${CUSTOMER_NO})}>0]?${CUSTOMER_NO}:${CALLERID(num)})})
 same => n,Set(__EHP_QUEUE=${QUEUE_NAME})
 same => n,Queue(${QUEUE_NAME},t,,,20)
 same => n,NoOp(Queue result: ${QUEUESTATUS})
 same => n,GotoIf($["${QUEUESTATUS}"="JOINEMPTY"]?noagents,1)
 same => n,GotoIf($["${QUEUESTATUS}"="FULL"]?noagents,1)
 same => n,GotoIf($["${QUEUESTATUS}"="TIMEOUT"]?noagents,1)
 same => n,GotoIf($["${QUEUESTATUS}"="LEAVEEMPTY"]?noagents,1)
 same => n,GotoIf($["${QUEUESTATUS}"=""]?badqueue,1)
 same => n,Hangup()
exten => s,n(badqueue),NoOp(IVR queue missing or not synced: ${QUEUE_NAME})
 same => n,Playback(custom/queue_unavailable)
 same => n,Hangup()
exten => noagents,1,NoOp(Queue ${QUEUE_NAME} unavailable: ${QUEUESTATUS} — play no-agents IVR)
 same => n,Set(FALLBACK_IVR_ID=${ODBC_GET_DID_CONDITION_IVR(${ORIGINAL_DID},no_agents_available)})
 same => n,GotoIf($["${FALLBACK_IVR_ID}"=""]?noagents_busy,1)
 same => n,Set(IVR_ID=${FALLBACK_IVR_ID})
 same => n,Goto(dynamic-ivr,s,1)
exten => noagents_busy,1,NoOp(Try busy/callback IVR for DID ${ORIGINAL_DID})
 same => n,Set(FALLBACK_IVR_ID=${ODBC_GET_DID_CONDITION_IVR(${ORIGINAL_DID},all_agents_busy)})
 same => n,GotoIf($["${FALLBACK_IVR_ID}"!=""]?set_busy_ivr,1)
 same => n,Set(FALLBACK_IVR_ID=${ODBC_GET_DID_CONDITION_IVR(${ORIGINAL_DID},callback)})
 same => n,GotoIf($["${FALLBACK_IVR_ID}"=""]?noagents_hangup,1)
 same => n,Goto(set_busy_ivr,1)
exten => set_busy_ivr,1,Set(IVR_ID=${FALLBACK_IVR_ID})
 same => n,Goto(dynamic-ivr,s,1)
exten => noagents_hangup,1,NoOp(No fallback IVR configured for DID ${ORIGINAL_DID})
 same => n,Hangup()


; =========================================================
; STRUCTURED VOICEMAIL — see deploy/asterisk_26_server/VOICEMAIL_STRUCTURE.md
; Base: /var/spool/asterisk/voicemail/default/{Campaign}/{DID}/...
; =========================================================
[ehp-voicemail-record]
exten => s,1,NoOp(Structured VM source=${VM_SOURCE} campaign=${EHP_CAMPAIGN} did=${ORIGINAL_DID})
 same => n,ExecIf($["${EHP_CAMPAIGN}"=""]?Set(EHP_CAMPAIGN=${ODBC_GET_DID_CAMPAIGN_FOLDER(${ORIGINAL_DID})}))
 same => n,ExecIf($["${EHP_CAMPAIGN}"=""]?Set(EHP_CAMPAIGN=Unknown))
 same => n,Set(VM_CUSTOMER=${FILTER(0123456789,${IF($[${LEN(${CUSTOMER_NO})}>0]?${CUSTOMER_NO}:${CALLERID(num)})})})
 same => n,ExecIf($[${LEN(${VM_CUSTOMER})}=0]?Set(VM_CUSTOMER=unknown))
 same => n,Set(VM_DID=${FILTER(0123456789,${ORIGINAL_DID})})
 same => n,ExecIf($[${LEN(${VM_DID})}=0]?Set(VM_DID=unknown))
 same => n,ExecIf($["${VM_SOURCE}"=""]?Set(VM_SOURCE=unknown))
 same => n,ExecIf($[${LEN(${VM_IVR_ID})}=0]?Set(VM_IVR_ID=${IVR_ID}))
 same => n,ExecIf($["${VM_IVR_NAME}"=""]?Set(VM_IVR_NAME=${ODBC_GET_IVR_NAME(${VM_IVR_ID})}))
 same => n,ExecIf($["${VM_IVR_CATEGORY}"=""]?Set(VM_IVR_CATEGORY=${ODBC_GET_IVR_CATEGORY(${VM_IVR_ID})}))
 same => n,ExecIf($["${VM_IVR_NAME}"=""]?Set(VM_IVR_NAME=unknown))
 same => n,ExecIf($["${VM_IVR_CATEGORY}"=""]?Set(VM_IVR_CATEGORY=unknown))
 same => n,Set(VM_QUEUE_SAFE=${FILTER(abcdefghijklmnopqrstuvwxyz0123456789_,${IF($[${LEN(${VM_QUEUE})}>0]?${VM_QUEUE}:${EHP_QUEUE})})})
 same => n,Set(VM_DATE=${STRFTIME(${EPOCH},,%Y-%m-%d)})
 same => n,GotoIf($["${VM_SOURCE}"="ivr"]?vm_dir_ivr,1)
 same => n,GotoIf($["${VM_SOURCE}"="queue"]?vm_dir_queue,1)
 same => n,GotoIf($["${VM_SOURCE}"="direct_route"]?vm_dir_route,1)
 same => n,Goto(vm_dir_unknown,1)

exten => vm_dir_ivr,1,Set(EHP_VM_DIR=/var/spool/asterisk/voicemail/default/${EHP_CAMPAIGN}/${VM_DID}/ivr/${VM_IVR_CATEGORY}/${VM_IVR_NAME})
 same => n,ExecIf($[${LEN(${VM_QUEUE_SAFE})}>0]?Set(EHP_VM_DIR=${EHP_VM_DIR}/via_queue_${VM_QUEUE_SAFE}))
 same => n,Set(EHP_VM_DIR=${EHP_VM_DIR}/${VM_DATE}/${VM_CUSTOMER})
 same => n,Goto(vm_record,1)

exten => vm_dir_queue,1,Set(EHP_VM_DIR=/var/spool/asterisk/voicemail/default/${EHP_CAMPAIGN}/${VM_DID}/queue/${VM_QUEUE_SAFE}/${VM_DATE}/${VM_CUSTOMER})
 same => n,Goto(vm_record,1)

exten => vm_dir_route,1,Set(EHP_VM_DIR=/var/spool/asterisk/voicemail/default/${EHP_CAMPAIGN}/${VM_DID}/route/direct/${VM_MAILBOX}/${VM_DATE}/${VM_CUSTOMER})
 same => n,Goto(vm_record,1)

exten => vm_dir_unknown,1,Set(EHP_VM_DIR=/var/spool/asterisk/voicemail/default/${EHP_CAMPAIGN}/${VM_DID}/unknown/${VM_DATE}/${VM_CUSTOMER})
 same => n,Goto(vm_record,1)

exten => vm_record,1,NoOp(VM path ${EHP_VM_DIR})
 same => n,Set(EHP_VM_FILE=${EHP_VM_DIR}/${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${UNIQUEID}.wav)
 same => n,System(mkdir -p '${EHP_VM_DIR}')
 same => n,Playback(beep)
 same => n,Record(${EHP_VM_FILE},30,120,kq)
 same => n,NoOp(Voicemail saved ${EHP_VM_FILE} status=${RECORD_STATUS})
 same => n,UserEvent(EHPVoicemailSaved,Campaign:${EHP_CAMPAIGN},Did:${VM_DID},CustomerNo:${VM_CUSTOMER},VmDate:${VM_DATE},Source:${VM_SOURCE},IvrCategory:${VM_IVR_CATEGORY},IvrName:${VM_IVR_NAME},IvrId:${VM_IVR_ID},IvrDigit:${VM_DIGIT},Queue:${VM_QUEUE_SAFE},Mailbox:${VM_MAILBOX},Path:${EHP_VM_FILE},LinkedId:${CHANNEL(linkedid)})
 same => n,Hangup()

exten => h,1,NoOp(Voicemail hangup path=${EHP_VM_FILE})

; =========================================================
; IVR ACTION — VOICEMAIL
; =========================================================
[ivr-opt-voicemail]

exten => s,1,NoOp(IVR Voicemail mailbox ${ACTION_VALUE})
same => n,Set(VM_SOURCE=ivr)
same => n,Set(VM_MAILBOX=${ACTION_VALUE})
same => n,ExecIf($[${LEN(${VM_IVR_ID})}=0]?Set(VM_IVR_ID=${IVR_ID}))
same => n,Set(VM_IVR_NAME=${ODBC_GET_IVR_NAME(${VM_IVR_ID})})
same => n,Set(VM_IVR_CATEGORY=${ODBC_GET_IVR_CATEGORY(${VM_IVR_ID})})
same => n,ExecIf($[${LEN(${EHP_QUEUE})}>0]?Set(VM_QUEUE=${EHP_QUEUE}))
same => n,Goto(ehp-voicemail-record,s,1)

; =========================================================
; IVR ACTION — CALLBACK
; =========================================================
[ivr-opt-callback]

exten => s,1,NoOp(IVR Callback)
same => n,Set(CALLBACK=${ODBC_ADD_CALLBACK(${CUSTOMER_NO},${ORIGINAL_DID},${ACTION_VALUE})})
same => n,Playback(custom/callback_registered)
same => n,Hangup()

; =========================================================
; IVR ACTION — NESTED IVR
; =========================================================
[ivr-opt-nested]

exten => s,1,NoOp(Nested IVR: ${ACTION_VALUE})
same => n,Set(IVR_ID=${ACTION_VALUE})
same => n,Goto(dynamic-ivr,s,1)


[ehp-agent-offer]
exten => _X.,1,NoOp(Hybrid agent offer ext ${EXTEN})
 same => n,Set(ACTIVE_DEV=${ODBC_GET_AGENT_DEVICE(${EXTEN})})
 same => n,GotoIf($["${ACTIVE_DEV}"="WEBRTC"]?webrtc)
 same => n,GotoIf($["${ACTIVE_DEV}"="BROWSER"]?webrtc)
 same => n,GotoIf($["${ACTIVE_DEV}"="XLITE"]?desk_hold)
 same => n,GotoIf($["${ACTIVE_DEV}"="ZOIPER"]?desk_hold)
 same => n,GotoIf($["${ACTIVE_DEV}"="LINPHONE"]?desk_hold)
 same => n,GotoIf($["${ACTIVE_DEV}"="EXTERNAL_SIP"]?desk_hold)
 same => n,GotoIf($[${LEN(${ACTIVE_DEV})}>0]?desk_dial)
 ; ODBC missing/empty — detect registered PJSIP endpoint (never autodial ws+desk)
 same => n,Set(WRTC_CONTACTS=${PJSIP_DIAL_CONTACTS(${EXTEN}ws)})
 same => n,GotoIf($[${LEN(${WRTC_CONTACTS})}>0]?webrtc)
 same => n,Set(DESK_CONTACTS=${PJSIP_DIAL_CONTACTS(${EXTEN})})
 same => n,GotoIf($[${LEN(${DESK_CONTACTS})}>0]?desk_hold)
 ; Hybrid app-control default: hold offer leg for app Answer (not direct X-Lite ring)
 same => n,Goto(desk_hold)
exten => _X.,n(webrtc),Set(OFFER_MODE=webrtc)
 same => n,Set(AGENT_DIAL=PJSIP/${EXTEN}ws)
 same => n,Goto(offer_event)
exten => _X.,n(desk_hold),Set(OFFER_MODE=desk_hold)
 same => n,Goto(offer_event)
exten => _X.,n(desk_dial),Set(OFFER_MODE=desk_dial)
 same => n,Set(AGENT_DIAL=PJSIP/${EXTEN})
 same => n,Goto(offer_event)
exten => _X.,n(offer_event),Set(GLOBAL(EHP_AGENT_${CHANNEL(linkedid)})=${EXTEN})
 same => n,UserEvent(EHPAgentOffer,CustomerNo:${CUSTOMER_NO},AgentExt:${EXTEN},LinkedId:${CHANNEL(linkedid)},Device:${ACTIVE_DEV})
 same => n,Set(__EHP_AGENT_EXT=${EXTEN})
 same => n,GotoIf($["${OFFER_MODE}"="desk_hold"]?desk_wait)
 same => n,Dial(${AGENT_DIAL},30)
 same => n,Hangup()
exten => _X.,n(desk_wait),Answer()
 same => n,Wait(45)
 same => n,Hangup()

[agent-offer]
exten => _X.,1,Goto(ehp-agent-offer,${EXTEN},1)

[ehp-agent-accept]
exten => _X.,1,NoOp(Agent accepted inbound ${EXTEN})
 same => n,ConfBridge(${EXTEN},,)
 same => n,Hangup()

[ehp-queue-join]
exten => _X.,1,NoOp(LEGACY queue join — use ehp-agent-offer)
 same => n,Goto(ehp-agent-accept,${EXTEN},1)

[ehp-app-outbound]
exten => _X.,1,NoOp(App outbound ${EXTEN} conf ${CONF_EXT})
 same => n,GotoIf($[${LEN(${CONF_EXT})}=0]?nodial)
 same => n,Set(NUM=${EXTEN})
 same => n,ExecIf($["${NUM:0:1}"="+"]?Set(NUM=${NUM:1}))
 same => n,ExecIf($["${NUM:0:2}"="91"]?Set(NUM=${NUM:2}))
 same => n,ExecIf($["${NUM:0:1}"!="0"]?Set(NUM=0${NUM}))
 same => n,Set(EHP_AGENT_RAW=${IF($[${LEN(${CONF_EXT})}>0]?${CONF_EXT}:${IF($[${LEN(${EHP_AGENT_EXT})}>0]?${EHP_AGENT_EXT}:${CHANNEL(endpoint)})})})
 same => n,ExecIf($["${EHP_AGENT_RAW:-2}"="ws"]?Set(EHP_AGENT_EXT=${EHP_AGENT_RAW:0:$[${LEN(${EHP_AGENT_RAW})}-2]}):Set(EHP_AGENT_EXT=${EHP_AGENT_RAW}))
 same => n,ExecIf($["${EHP_CAMPAIGN}"=""]?Set(EHP_CAMPAIGN=${ODBC_GET_AGENT_CAMPAIGN_FOLDER(${EHP_AGENT_EXT})}))
 same => n,ExecIf($["${EHP_QUEUE}"=""]?Set(EHP_QUEUE=${ODBC_GET_AGENT_QUEUE(${EHP_AGENT_EXT})}))
 same => n,ExecIf($[${LEN(${ORIGINAL_DID})}=0]?Set(ORIGINAL_DID=${ODBC_GET_AGENT_CAMPAIGN_DID(${EHP_AGENT_EXT})}))
 same => n,Set(__CUSTOMER_NO=${NUM})
 same => n,Set(__EHP_DIRECTION=outbound)
 same => n,Set(CHANNEL(hangup_handler_push)=ehp-recording-hangup,s,1)
 same => n,Set(EHP_REC_STEM=${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-out-${CHANNEL(linkedid)})
 same => n,MixMonitor(/var/spool/asterisk/monitor/${EHP_REC_STEM}.wav,b)
 same => n,Set(CALLERID(num)=0700000000)
 same => n,Dial(PJSIP/${NUM}@Mediant,60,U(ehp-join-conf^s^1))
 same => n,Hangup()
exten => _X.,n(nodial),Hangup()

[ehp-join-conf]
exten => s,1,ConfBridge(${CONF_EXT},,)
 same => n,Return()

; =========================================================
; RECORDING → MinIO metadata (hangup handler)
; =========================================================
[ehp-recording-hangup]
exten => s,1,NoOp(EHP recording hangup mixmon=${MIXMONITOR_FILENAME})
 same => n,GotoIf($[${LEN(${MIXMONITOR_FILENAME})}=0]?done)
 same => n,GotoIf($["${MIXMONITOR_FILENAME:0:1}"="/"]?abs_path)
 same => n,Set(EHP_REC_PATH=/var/spool/asterisk/monitor/${MIXMONITOR_FILENAME})
 same => n,Goto(meta)
 same => n(abs_path),Set(EHP_REC_PATH=${MIXMONITOR_FILENAME})
 same => n(meta),ExecIf($[${LEN(${EHP_CAMPAIGN})}=0]?Set(EHP_CAMPAIGN=${ODBC_GET_DID_CAMPAIGN_FOLDER(${ORIGINAL_DID})}))
 same => n,ExecIf($[${LEN(${EHP_AGENT_EXT})}=0]?Set(EHP_AGENT_EXT=${GLOBAL(EHP_AGENT_${CHANNEL(linkedid)})}))
 same => n,ExecIf($["${EHP_AGENT_EXT:-2}"="ws"]?Set(EHP_AGENT_EXT=${EHP_AGENT_EXT:0:$[${LEN(${EHP_AGENT_EXT})}-2]}))
 same => n,UserEvent(EHPRecordingSaved,Campaign:${EHP_CAMPAIGN},Did:${ORIGINAL_DID},CustomerNo:${CUSTOMER_NO},Queue:${EHP_QUEUE},AgentExt:${EHP_AGENT_EXT},Direction:${IF($[${LEN(${EHP_DIRECTION})}>0]?${EHP_DIRECTION}:inbound)},RecDate:${STRFTIME(${EPOCH},,%Y-%m-%d)},Path:${EHP_REC_PATH},LinkedId:${CHANNEL(linkedid)})
 same => n,Set(GLOBAL(EHP_AGENT_${CHANNEL(linkedid)})=)
exten => s,n(done),Return()

#include extensions_japit.conf