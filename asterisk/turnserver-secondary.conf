# AST-01 - coturn secondary node
# Replace the example realm/public/private addresses before deployment.
listening-port=3478
listening-ip=SECONDARY_PRIVATE_IP
relay-ip=SECONDARY_PRIVATE_IP
external-ip=SECONDARY_PUBLIC_IP/SECONDARY_PRIVATE_IP

tls-listening-port=5349
fingerprint
use-auth-secret
# MUST match the primary node secret.
static-auth-secret=REPLACE_WITH_LONG_RANDOM_TURN_SECRET
realm=turn.japit.example
server-name=turn-secondary.japit.example

no-cli
no-multicast-peers
no-loopback-peers
stale-nonce=600
min-port=49152
max-port=65535
simple-log
log-file=/var/log/turnserver/turnserver-secondary.log
