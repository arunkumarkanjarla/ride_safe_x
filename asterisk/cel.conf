;
; Asterisk Channel Event Logging (CEL) — Japit enterprise enablement (AST-15)
;

[general]
enable=yes
apps=dial,queue,park,confbridge,mixmonitor
events=APP_START,APP_END,CHAN_START,CHAN_END,ANSWER,HANGUP,BRIDGE_ENTER,BRIDGE_EXIT,USER_DEFINED,LINKEDID_END,BLINDTRANSFER,ATTENDEDTRANSFER
dateformat = %F %T

[manager]
enabled=yes
show_user_defined=yes
