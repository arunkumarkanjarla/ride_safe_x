<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1023 629" width="1023" height="629" role="img" aria-label="OTP login and token refresh"><rect width="1023" height="629" fill="#FFFFFF"/><defs><marker id="s18_n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6A7B88"/></marker><marker id="s18_acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0B7A68"/></marker><marker id="s18_alert" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C2410C"/></marker><marker id="s18_info" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2F5DA8"/></marker><marker id="s18_data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6B4FB3"/></marker><marker id="s18_warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A8690F"/></marker></defs><text x="24" y="38" font-size="15" font-weight="700" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#14202A">OTP login and token refresh</text><line x1="121.5" x2="121.5" y1="98" y2="617" stroke="#C3CFD7" stroke-dasharray="4 4"/><rect x="34.0" y="58" width="175" height="40" rx="8" fill="#14202A" stroke="#14202A" stroke-width="1.4"/><text x="121.5" y="82" text-anchor="middle" font-size="12.5" font-weight="600" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#FFFFFF">Rider / Driver App</text><line x1="316.5" x2="316.5" y1="98" y2="617" stroke="#C3CFD7" stroke-dasharray="4 4"/><rect x="229.0" y="58" width="175" height="40" rx="8" fill="#E3ECFA" stroke="#2F5DA8" stroke-width="1.4"/><text x="316.5" y="82" text-anchor="middle" font-size="12.5" font-weight="600" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#1B3765">API Gateway</text><line x1="511.5" x2="511.5" y1="98" y2="617" stroke="#C3CFD7" stroke-dasharray="4 4"/><rect x="424.0" y="58" width="175" height="40" rx="8" fill="#DCF1EB" stroke="#0B7A68" stroke-width="1.4"/><text x="511.5" y="82" text-anchor="middle" font-size="12.5" font-weight="600" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#0A3F36">Auth Svc</text><line x1="706.5" x2="706.5" y1="98" y2="617" stroke="#C3CFD7" stroke-dasharray="4 4"/><rect x="619.0" y="58" width="175" height="40" rx="8" fill="#EEE8FA" stroke="#6B4FB3" stroke-width="1.4"/><text x="706.5" y="82" text-anchor="middle" font-size="12.5" font-weight="600" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#3A2A66">Redis</text><line x1="901.5" x2="901.5" y1="98" y2="617" stroke="#C3CFD7" stroke-dasharray="4 4"/><rect x="814.0" y="58" width="175" height="40" rx="8" fill="#F6F8F9" stroke="#8A99A6" stroke-width="1.4"/><text x="901.5" y="82" text-anchor="middle" font-size="12.5" font-weight="600" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#33424E">SMS adapter</text><line x1="121.5" y1="120" x2="310.5" y2="120" stroke="#6A7B88" stroke-width="1.5" marker-end="url(#s18_n)"/><text x="219.0" y="114" text-anchor="middle" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#14202A">1. POST /auth/otp {phone, device_id}</text><line x1="316.5" y1="154" x2="505.5" y2="154" stroke="#6A7B88" stroke-width="1.5" marker-end="url(#s18_n)"/><text x="414.0" y="148" text-anchor="middle" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#14202A">2. rate limit: 3/phone/10 min</text><line x1="511.5" y1="188" x2="700.5" y2="188" stroke="#6A7B88" stroke-width="1.5" marker-end="url(#s18_n)"/><text x="609.0" y="182" text-anchor="middle" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#14202A">3. store OTP hash, 5 min TTL</text><line x1="511.5" y1="222" x2="895.5" y2="222" stroke="#6A7B88" stroke-width="1.5" marker-end="url(#s18_n)"/><text x="706.5" y="216" text-anchor="middle" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#14202A">4. send 6-digit OTP</text><line x1="511.5" y1="256" x2="127.5" y2="256" stroke="#8A99A6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#s18_n)"/><text x="316.5" y="250" text-anchor="middle" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#566878">202 accepted</text><line x1="121.5" y1="290" x2="310.5" y2="290" stroke="#6A7B88" stroke-width="1.5" marker-end="url(#s18_n)"/><text x="219.0" y="284" text-anchor="middle" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#14202A">5. POST /auth/verify {phone, otp}</text><line x1="316.5" y1="324" x2="505.5" y2="324" stroke="#6A7B88" stroke-width="1.5" marker-end="url(#s18_n)"/><text x="414.0" y="318" text-anchor="middle" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#14202A">6. verify</text><line x1="511.5" y1="358" x2="700.5" y2="358" stroke="#6A7B88" stroke-width="1.5" marker-end="url(#s18_n)"/><text x="609.0" y="352" text-anchor="middle" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#14202A">7. compare hash, max 5 tries</text><path d="M511.5 392 H545.5 V410 H513.5" fill="none" stroke="#6A7B88" stroke-width="1.5" marker-end="url(#s18_n)"/><text x="551.5" y="405" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#14202A">8. bind device, risk check</text><line x1="511.5" y1="430" x2="127.5" y2="430" stroke="#8A99A6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#s18_n)"/><text x="316.5" y="424" text-anchor="middle" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#566878">access JWT 15 min + refresh 30 days</text><line x1="24" x2="999" y1="470" y2="470" stroke="#A8690F" stroke-dasharray="4 4"/><rect x="24" y="460" width="46.800000000000004" height="20" rx="4" fill="#FBF0D9" stroke="#A8690F"/><text x="32" y="474" font-size="11" font-weight="700" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#5C3A07">Later</text><line x1="121.5" y1="498" x2="505.5" y2="498" stroke="#6A7B88" stroke-width="1.5" marker-end="url(#s18_n)"/><text x="316.5" y="492" text-anchor="middle" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#14202A">9. POST /auth/refresh</text><path d="M511.5 532 H545.5 V550 H513.5" fill="none" stroke="#6A7B88" stroke-width="1.5" marker-end="url(#s18_n)"/><text x="551.5" y="545" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#14202A">10. rotate refresh, revoke old one</text><rect x="39.6" y="558" width="943.8" height="25" rx="6" fill="#FCE8DD" stroke="#C2410C"/><text x="511.5" y="573" text-anchor="middle" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#6E250A">Reuse of an old refresh token revokes the whole session family (token theft signal)</text></svg>