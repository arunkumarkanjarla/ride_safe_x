t-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#6E250A">Safety Svc</text><line x1="436.5" x2="436.5" y1="98" y2="530" stroke="#C3CFD7" stroke-dasharray="4 4"/><rect x="364.0" y="58" width="145" height="40" rx="8" fill="#DCF1EB" stroke="#0B7A68" stroke-width="1.4"/><text x="436.5" y="82" text-anchor="middle" font-size="12.5" font-weight="600" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#0A3F36">Location</text><line x1="601.5" x2="601.5" y1="98" y2="530" stroke="#C3CFD7" stroke-dasharray="4 4"/><rect x="529.0" y="58" width="145" height="40" rx="8" fill="#E3ECFA" stroke="#2F5DA8" stroke-width="1.4"/><text x="601.5" y="82" text-anchor="middle" font-size="12.5" font-weight="600" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#1B3765">Ops Console</text><line x1="766.5" x2="766.5" y1="98" y2="530" stroke="#C3CFD7" stroke-dasharray="4 4"/><rect x="694.0" y="58" width="145" height="40" rx="8" fill="#FFFFFF" stroke="#AEBDC8" stroke-width="1.4"/><text x="766.5" y="82" text-anchor="middle" font-size="12.5" font-weight="600" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#14202A">Notifications</text><line x1="931.5" x2="931.5" y1="98" y2="530" stroke="#C3CFD7" stroke-dasharray="4 4"/><rect x="859.0" y="58" width="145" height="40" rx="8" fill="#14202A" stroke="#14202A" stroke-width="1.4"/><text x="931.5" y="75" text-anchor="middle" font-size="12.5" font-weight="600" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#FFFFFF">Emergency</text><text x="931.5" y="89" text-anchor="middle" font-size="12.5" font-weight="600" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#FFFFFF">contacts</text><line x1="1096.5" x2="1096.5" y1="98" y2="530" stroke="#C3CFD7" stroke-dasharray="4 4"/><rect x="1024.0" y="58" width="145" height="40" rx="8" fill="#FFFFFF" stroke="#AEBDC8" stroke-width="1.4"/><text x="1096.5" y="82" text-anchor="middle" font-size="12.5" font-weight="600" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#14202A">Telephony</text><line x1="106.5" y1="120" x2="265.5" y2="120" stroke="#6A7B88" stroke-width="1.5" marker-end="url(#s14_n)"/><text x="189.0" y="114" text-anchor="middle" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#14202A">1. SOS pressed (hold 2 s)</text><path d="M271.5 154 H305.5 V172 H273.5" fill="none" stroke="#6A7B88" stroke-width="1.5" marker-end="url(#s14_n)"/><text x="311.5" y="167" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#14202A">2. create incident P1 · OPEN</text><line x1="271.5" y1="192" x2="430.5" y2="192" stroke="#6A7B88" stroke-width="1.5" marker-end="url(#s14_n)"/><text x="354.0" y="186" text-anchor="middle" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#14202A">3. switch trip to 1 s GPS</text><line x1="271.5" y1="226" x2="595.5" y2="226" stroke="#6B4FB3" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#s14_data)"/><text x="436.5" y="220" text-anchor="middle" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#14202A">4. alarm on safety console</text><line x1="271.5" y1="260" x2="760.5" y2="260" stroke="#6B4FB3" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#s14_data)"/><text x="519.0" y="254" text-anchor="middle" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#14202A">5. alert contacts</text><line x1="766.5" y1="294" x2="925.5" y2="294" stroke="#6B4FB3" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#s14_data)"/><text x="849.0" y="288" text-anchor="middle" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#14202A">6. SMS/WhatsApp: live trip link</text><line x1="601.5" y1="328" x2="277.5" y2="328" stroke="#6A7B88" stroke-width="1.5" marker-end="url(#s14_n)"/><text x="436.5" y="322" text-anchor="middle" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#14202A">7. agent acknowledges (&lt; 60 s)</text><line x1="601.5" y1="362" x2="1090.5" y2="362" stroke="#6A7B88" stroke-width="1.5" marker-end="url(#s14_n)"/><text x="849.0" y="356" text-anchor="middle" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#14202A">8. call rider via masked line</text><rect x="37.2" y="384" width="1128.6" height="40" rx="6" fill="#FCE8DD" stroke="#C2410C"/><text x="601.5" y="399" text-anchor="middle" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#6E250A">The app shows a one-tap call to the local emergency number (112 in India and the EU, 911 in the US).</text><text x="601.5" y="414" text-anchor="middle" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#6E250A">The platform never claims to have contacted police unless an agent actually did.</text><line x1="601.5" y1="450" x2="277.5" y2="450" stroke="#6A7B88" stroke-width="1.5" marker-end="url(#s14_n)"/><text x="436.5" y="444" text-anchor="middle" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#14202A">9. escalate / resolve with notes</text><path d="M271.5 484 H305.5 V502 H273.5" fill="none" stroke="#6A7B88" stroke-width="1.5" marker-end="url(#s14_n)"/><text x="311.5" y="497" font-size="11.5" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#14202A">10. evidence frozen: GPS, events, calls</text></svg>